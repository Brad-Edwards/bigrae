name: Install ShellCheck
description: Install the reviewed ShellCheck binary with a pinned checksum.

runs:
  using: composite
  steps:
    - name: Install ShellCheck
      shell: bash
      env:
        SHELLCHECK_VERSION: v0.10.0
        SHELLCHECK_SHA256: 6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87
      run: |
        set -euo pipefail
        archive="${RUNNER_TEMP}/shellcheck-${SHELLCHECK_VERSION}.tar.xz"
        install_root="${RUNNER_TEMP}/shellcheck-bin"
        curl -fsSL -o "${archive}" \
          "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
        echo "${SHELLCHECK_SHA256}  ${archive}" | sha256sum -c -
        mkdir -p "${install_root}"
        tar -xJf "${archive}" -C "${install_root}" --strip-components=1 \
          "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
        echo "${install_root}" >> "${GITHUB_PATH}"
        "${install_root}/shellcheck" --version
