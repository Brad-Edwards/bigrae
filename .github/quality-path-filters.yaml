# Production-path quality-ownership contract (#1530, GEN-002).
#
# Single versioned, machine-readable source of truth for CI quality routing
# AND ownership. Consumed by:
#   * scripts/quality_ownership/classify_paths.py  -> the always-run `paths`
#     job in .github/workflows/_quality.yml. It validates this contract and
#     rejects an unknown changed path *before* emitting any job-selection
#     output (fail-closed execution boundary), then writes the per-category
#     GITHUB_OUTPUT keys the downstream jobs consume.
#   * scripts/adr_guard/adr_guard.py `quality-path-ownership` check -> the
#     ci-level conformance guard (estate completeness, per-path ownership
#     completeness across lint/security/test, and routing reachability against
#     the real workflow).
#
# Schema (validated by scripts/quality_ownership/contract.py):
#   schema_version        : must be 1.
#   force_full_matrix     : globs that force the full quality matrix (the CI
#                           control plane). A change here reruns every job and
#                           emits the `ci_workflows` output; a broken pipeline
#                           cannot slip through.
#   quality_units[]       : production owners.
#     id                  : the GITHUB_OUTPUT key downstream jobs condition on.
#     paths               : repo-relative globs (`dir/**` or fnmatch).
#     packages            : optional #1523 first-party package identifiers,
#                           reconciled against
#                           scripts/check_layer_imports/layer_imports.yaml.
#     sonar               : whether a change participates in SonarCloud scope.
#     mcp                 : {package, fanout_all_on_change} for MCP matrix jobs.
#     responsibilities    : lint / security / test -> the blocking jobs (or
#                           {job, matrix} selectors) that enforce each. A unit
#                           may leave a responsibility empty when NO blocking
#                           job covers its paths (a genuine gap); the gap is
#                           recorded as a time-bounded docs/adr/exceptions.yaml
#                           entry, never a silent pass.
#   exclusions[]          : narrow, typed carve-outs from production ownership
#                           ({type, reason, paths}). type is a closed enum.
#
# Ownership completeness is evaluated per production PATH: the union of every
# unit matching a path must cover lint AND security AND test. Precedence is
# most-specific-pattern-wins, so a unit glob (e.g. docs/adr/**) can be owned
# even though a broader exclusion (docs/**) also matches.

schema_version: 1

force_full_matrix:
  - .github/workflows/**
  # Local composite actions are CI control plane called by the workflows.
  - .github/actions/**
  - .github/quality-path-filters.yaml

quality_units:
  - id: guacamole_authority
    paths:
      - shifter/engine/guacamole/authority-extension/**
      - shifter/shifter_platform/tests/integration/test_guacamole_native*.py
      - shifter/shifter_platform/tests/integration/guacamole_*.py
      - shifter/shifter_platform/tests/integration/guacamole-rdp/**
    sonar: true
    responsibilities:
      lint: [guacamole-authority-sast]
      security: [guacamole-authority-sast]
      test: [guacamole-authority-tests]

  - id: shifter_platform
    paths:
      - shifter/shifter_platform/**
      - shifter/shifter_adapter_sdk/**
      - shifter/shifter_client/**
      # Shifter-owned environment packs (#2550). Platform pack-loading,
      # bootstrap/conformance, object-source and backend-validation tests
      # consume every pack in the collection.
      - shifter/environment-packs/**
      - .importlinter
      # Generated S8 authority-surface inventory is contract-tested by the
      # platform suite and participates in the same lint/SAST boundary.
      - scripts/generate_identity_surface_inventory.py
    packages:
      - engine
      - cms
      - management
      - ctf
      - mission_control
      - shared
      - config
      - workspaces
    sonar: true
    responsibilities:
      lint: [shifter-platform-lint, shifter-platform-lint-js]
      security: [shifter-platform-sast]
      test: [shifter-platform-tests, shifter-platform-coverage, shifter-platform-redis, adapter-sdk-tests, shifter-platform-openfga, shifter-platform-js-tests, shifter-platform-e2e]

  - id: provisioner
    paths:
      - shifter/engine/provisioner/**
      # The provisioner operating-system tests read this pack's SDL (#2550).
      - shifter/environment-packs/shifter-raes-validation/**
    sonar: true
    responsibilities:
      lint: [provisioner-lint]
      security: [provisioner-sast]
      test: [shifter-engine-tests]

  - id: packer
    paths:
      - shifter/packer/**
    sonar: true
    responsibilities:
      lint: [packer-lint]
      security: [packer-sast]
      test: [packer-tests]

  - id: openvpn
    paths:
      - shifter/engine/openvpn/**
    sonar: true
    responsibilities:
      lint: [openvpn-lint]
      security: [openvpn-sast]
      test: [openvpn-tests]

  - id: bootstrap
    paths:
      - scripts/bootstrap/**
    sonar: true
    responsibilities:
      lint: [bootstrap-lint]
      security: [bootstrap-sast]
      test: [bootstrap-tests]

  - id: gcp_scripts
    paths:
      - scripts/gcp/**
    sonar: false
    responsibilities:
      lint: [gcp-scripts-lint]
      security: [gcp-scripts-sast]
      test: [gcp-scripts-tests]

  - id: check_layer_imports
    paths:
      - scripts/check_layer_imports/**
    sonar: true
    responsibilities:
      lint: [check-layer-imports-lint]
      security: [check-layer-imports-sast]
      test: [check-layer-imports-tests]

  - id: check_rds_pending_modifications
    paths:
      - scripts/check_rds_pending_modifications/**
    sonar: false
    responsibilities:
      lint: [check-rds-pending-modifications-lint]
      security: [deployment-utilities-sast]
      test: [check-rds-pending-modifications-tests]

  - id: handle_sd_replacement
    paths:
      - scripts/handle_sd_replacement/**
    sonar: false
    responsibilities:
      lint: [handle-sd-replacement-lint]
      security: [deployment-utilities-sast]
      test: [handle-sd-replacement-tests]

  - id: assert_portal_inspection
    paths:
      - scripts/assert_portal_inspection/**
    sonar: false
    responsibilities:
      lint: [assert-portal-inspection-lint]
      security: [deployment-utilities-sast]
      test: [assert-portal-inspection-tests]

  - id: installation
    paths:
      - shifter/installation/**
    sonar: true
    responsibilities:
      lint: [installation-lint]
      security: [installation-sast]
      test: [installation-tests]

  - id: event_load_harness
    paths:
      - uat/event-load-harness/**
    sonar: false
    responsibilities:
      lint: [event-load-harness-lint]
      security: [event-load-harness-sast]
      test: [event-load-harness-tests]

  - id: range_functional_smoke
    paths:
      - uat/range-functional-smoke/**
    sonar: false
    responsibilities:
      lint: [range-functional-smoke-lint]
      security: [range-functional-smoke-sast]
      test: [range-functional-smoke-tests]

  - id: terraform
    paths:
      - platform/terraform/**
      - .tflint.hcl
      - scripts/check_tf_iam_ec2_scope/**
      - scripts/check_tf_iam_elb_scope/**
      - scripts/check_tf_sg_cidrs/**
      - scripts/check_tf_kms_secrets_grant/**
      - scripts/check_tf_rds_security/**
      - scripts/check_tf_iam_ssm_range_scope/**
      - scripts/check_portal_target_sg_sources/**
      - scripts/check_tf_roots/**
      - shifter/engine/provisioner/terraform/**
    sonar: false
    responsibilities:
      lint: [terraform-lint]
      security: [security-iac]
      test: [terraform-validate]

  - id: mcp_ngfw
    paths:
      - mcp/ngfw/**
    sonar: true
    mcp:
      package: ngfw
    responsibilities:
      lint: [{job: mcp-lint, matrix: {package: ngfw}}]
      security: [{job: mcp-lint, matrix: {package: ngfw}}]
      test: [{job: mcp-tests, matrix: {package: ngfw}}]

  - id: mcp_ops
    paths:
      - mcp/ops/**
    sonar: true
    mcp:
      package: ops
    responsibilities:
      lint: [{job: mcp-lint, matrix: {package: ops}}]
      security: [{job: mcp-lint, matrix: {package: ops}}]
      test: [{job: mcp-tests, matrix: {package: ops}}]

  - id: mcp_planner
    paths:
      - mcp/planner/**
    sonar: true
    mcp:
      package: planner
    responsibilities:
      lint: [{job: mcp-lint, matrix: {package: planner}}]
      security: [{job: mcp-lint, matrix: {package: planner}}]
      test: [{job: mcp-tests, matrix: {package: planner}}]

  - id: mcp_shared
    paths:
      - mcp/shared/**
    sonar: true
    mcp:
      package: shared
      fanout_all_on_change: true
    responsibilities:
      lint: [{job: mcp-lint, matrix: {package: shared}}]
      security: [{job: mcp-lint, matrix: {package: shared}}]
      test: [{job: mcp-tests, matrix: {package: shared}}]

  - id: adr_guard
    paths:
      - scripts/adr_guard/**
      - scripts/quality_ownership/**
      - docs/adr/**
      - .pre-commit-config.yaml
      - AGENTS.md
      - .ground-control.yaml
      - .gc/plan-rules.md
      - .shifter.yaml
    sonar: false
    responsibilities:
      lint: [adr-guard-lint-security]
      security: [adr-guard-lint-security]
      test: [adr-guard-tests]

  - id: stack_smoke
    paths:
      - scripts/stack-smoke/**
    sonar: false
    responsibilities:
      lint: [stack-smoke-lint-security]
      security: [stack-smoke-lint-security]
      test: [stack-smoke-lint-security, stack-smoke]

  # Tracked build / deployment / runtime inputs are production owners, not
  # exclusions (ADR-004-R24 forbids exempting shipped build/runtime material via
  # exclusions). Each responsibility resolves to a blocking job below.
  - id: container_images
    paths:
      - shifter/engine/guacamole/**
      - shifter/engine/guacd/**
    sonar: false
    responsibilities:
      lint: [container-images-lint-security]
      security: [container-images-lint-security]
      test: [guacamole-authority-tests, guacd-image-tests]

  # GitHub-less GCP deployer image (#2571, ADR-070).
  - id: gcp_deployer
    paths:
      - platform/deployer/**
    sonar: false
    responsibilities:
      lint: [container-images-lint-security]
      security: [container-images-lint-security]
      test: [gcp-deployer-image]

  - id: portal_image_context
    paths:
      - shifter/.dockerignore
    sonar: false
    responsibilities:
      lint: [container-images-lint-security]
      security: [container-images-lint-security]
      test: [stack-smoke]

  # Chart admission policies and the provisioner Job builder they admit. The
  # admission-apiserver job applies the policies to a real kube-apiserver
  # (#2651). The paths overlap the charts and shifter_platform units, which own
  # their lint and security. The server start script is a CI helper (see the
  # config exclusion below).
  - id: provisioner_admission
    paths:
      - platform/charts/shifter/templates/validatingadmissionpolicy-*.yaml
      - platform/charts/shifter/templates/runtime-plugins.yaml
      - platform/charts/shifter/templates/feature-artifact-acquisition.yaml
      - platform/charts/shifter/templates/runtime-plugin-node-labeler.yaml
      - platform/charts/shifter/templates/configmap-runtime.yaml
      - platform/charts/shifter/templates/_helpers.tpl
      - platform/charts/shifter/values*.yaml
      - shifter/shifter_platform/shared/cloud/kubernetes/**
      - shifter/shifter_platform/shared/cloud/gcp/task_runner.py
      - shifter/shifter_platform/shared/cloud/aws/task_runner.py
      - shifter/shifter_platform/tests/platform/test_admission_policy_apiserver.py
      - shifter/shifter_platform/tests/platform/test_gcp_job_launcher_manifests.py
    sonar: false
    responsibilities:
      lint: []
      security: []
      test: [admission-apiserver]

  # The Helm chart is the only Kubernetes renderer (ADR-007, #2571). Every
  # Kubernetes gate validates the rendered chart for each supported profile.
  - id: charts
    paths:
      - platform/charts/**
      - .kube-linter.yaml
    sonar: false
    responsibilities:
      lint: [chart-lint-security]
      security: [chart-lint-security, security-k8s]
      test: [chart-tests, k8s-schema]

exclusions:
  - type: docs
    reason: >-
      Documentation prose (Markdown, diagrams, and supporting assets). Not
      product or infrastructure source; docs-only skipping is governed by
      deploy.yml quality_relevant routing, and guardrail docs under docs/adr/**
      are owned by the adr_guard unit via most-specific precedence.
    paths:
      - docs/**
      - README.md
      - CHANGELOG.md
      - CODE_OF_CONDUCT.md
      - CONTRIBUTING.md
      - SECURITY.md
      - SUPPORT.md
      - LICENSE
      - '**/*.md'

  - type: metadata
    reason: >-
      Repository and agent metadata / tooling configuration (editor, agent,
      and spec harness settings). Not product or infrastructure source.
    paths:
      - .claude/**
      - .cursor/**
      - .gemini/**
      - .specify/**
      - .github/CODEOWNERS
      - .github/actionlint.yaml
      - .github/codeql/**
      - .github/copilot-instructions.md
      - .github/dependabot.yml
      - .github/pull_request_template.md
      - .gitignore
      - .gitguardian.yaml
      - .gitleaks.toml
      - .snyk
      - .vale.ini
      - .mcp.json
      - CLAUDE.md

  - type: config
    reason: >-
      Repository build / release / lint / scanner tool configuration governed by
      its own tooling (mkdocs, release-please, sonar, trivy, make, npm lockfile).
      Not product or infrastructure source subject to the production three-owner
      rule.
    paths:
      - Makefile
      - mkdocs.yml
      - release-please-config.json
      - .release-please-manifest.json
      - version.txt
      - sonar-project.properties
      # Exact-release Trivy exposure-management policy consumed by the
      # release-scan gate in .github/workflows/_gcp-dev.yml (--ignorefile).
      - .trivyignore.yaml
      # OSV-Scanner policy consumed by the Security (osv-scanner) quality job
      # via --config. Any future suppression must be time-boxed and limited to
      # an advisory with no upstream fix.
      - osv-scanner.toml
      - tools/install-vale.sh

  - type: config
    reason: >-
      CI / deploy / guard helper scripts governed by pre-commit hooks and the
      jobs that invoke them (terraform-lint IaC guards, deploy helpers, dev/ops
      utilities). Not product or infrastructure source that ships at runtime.
    paths:
      - scripts/check_tf_runner_network/**
      - scripts/check_tf_iam_ssm_scope/**
      - scripts/check_tf_iam_role_naming/**
      - scripts/check_tf_gcp_runner_network/**
      - scripts/check_tf_gcp_iam_resource_scope/**
      - scripts/check_tf_gcp_wif_trust/**
      - scripts/check_provisioner_locks/**
      - scripts/check_gcp_tf_modules/**
      - scripts/check_checkov_invocation_parity/**
      - scripts/post_deploy_smoke/**
      - scripts/admission_apiserver/**
      - scripts/terraform/**
      - scripts/tests/**
      # Root-level helper scripts are enumerated (not a scripts/* wildcard) so a
      # new script package under scripts/ still fails closed as unclassified.
      - scripts/ami.sh
      - scripts/bump-version.sh
      - scripts/check-ngfw.sh
      - scripts/config-claude.sh
      - scripts/count-loc.sh
      - scripts/delete-user.sh
      - scripts/dev-box.sh
      - scripts/find-orphan-instances.py
      - scripts/fix_resume.py
      - scripts/get-devbox-password.sh
      - scripts/iam-deploy.sh
      - scripts/runner-deploy.sh
      - scripts/setup-worktree.sh
      - scripts/shifter-django-admin-tunnel.sh
      - scripts/smoke-test-windows.sh
      - scripts/smoke-test.sh
      - scripts/smoke-test-gcp.sh
      - scripts/sync-deploy-secrets.sh
      - scripts/update-coverage-readme.py

  - type: test
    reason: >-
      Standalone UAT scripts and fixtures not part of a production package's
      own test suite.
    paths:
      - uat/uat_test_script.py
      - uat/test.txt
