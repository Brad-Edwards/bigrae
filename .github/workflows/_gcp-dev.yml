name: GCP Dev

# Thin CI wrapper over the GitHub-less GCP deploy commands (ADR-070, #2571).
# Each job renders the deployment input bundle from this repository's GitHub
# secrets and variables (scripts/gcp/render_ci_deployment_inputs.py), then runs
# the same `deploy.py` command that an operator runs. The deploy logic, the
# ADR-037 release gates, and the evidence handling live in scripts/bootstrap.

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      github_environment:
        required: true
        type: string
      release_scan_github_environment:
        description: Protected GitHub Environment for the purpose-scoped release scanner.
        required: true
        type: string
      deploy_changes:
        required: true
        type: boolean
      reconcile_foundation_image_network:
        required: false
        type: boolean
        default: false
      require_active_certificate:
        description: >-
          Fail the deploy if the managed certificate is not Active for the public
          hostname (the portal is rendered for https://<hostname> only). Set false
          for first-time bootstrap before DNS is pointed at the ingress IP.
        required: false
        type: boolean
        default: true
    secrets:
      GCP_DEPLOY_SERVICE_ACCOUNT:
        required: false
      GCP_RELEASE_SCAN_SERVICE_ACCOUNT:
        required: false
      GCP_WORKLOAD_IDENTITY_PROVIDER:
        required: false
      GCP_BOOTSTRAP_ADMIN_EMAIL:
        required: false
      GCP_BOOTSTRAP_ADMIN_PASSWORD:
        required: false
      PLATFORM_BOOTSTRAP_STAFF_EMAILS:
        required: false
      PLATFORM_BOOTSTRAP_SUPERUSER_EMAILS:
        required: false
      # Deployment-owned values that the CI adapter projects onto the deployment
      # input bundle. See docs/dev/deploy-secrets.md for the canonical list.
      GCP_PROJECT_ID:
        required: false
      GCP_PUBLIC_HOSTNAME:
        required: false
      GCP_IDENTITY_ALLOWED_EMAIL_DOMAIN:
        required: false
      GCP_RANGE_IMAGE_KEY_PROFILES_JSON:
        required: false
      # Deployment shifter.yaml (full root installation config). The adapter
      # projects the GitHub variables onto its settings and fails on a conflict.
      SHIFTER_CONFIG_GCP_DEV:
        required: false
      # One-time S8 facts are mounted into the cutover Job as files. They are
      # never placed in argv, environment values, ConfigMaps, or logs.
      IDENTITY_CUTOVER_FACTS_JSON:
        required: false
      IDENTITY_BOOTSTRAP_FACTS_JSON:
        required: false
      CATALOG_CREDENTIAL:
        required: false
      SMOKE_TEST_USER_EMAIL:
        required: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ inputs.environment }})
    # Validation does not need deploy-network access; keep PR checks off the deploy runner pool.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.17.1"
      - run: terraform fmt -check -recursive
        working-directory: platform/terraform/gcp
      - run: terraform init -backend=false
        working-directory: platform/terraform/gcp/environments/platform
      - run: terraform validate
        working-directory: platform/terraform/gcp/environments/platform

  prepare:
    # Runs on the requested GCP tenant's same-named runner, provisioned by
    # `deploy.py runners --cloud gcp` (issue #1546), so one tenant never borrows
    # another tenant's self-hosted fleet. The dynamic label is self-hosted-class
    # to the ADR-003-R5 exposure checker, so the PR gate below still applies.
    name: Prepare release (${{ inputs.environment }})
    runs-on: ${{ inputs.environment }}
    environment: ${{ inputs.github_environment }}
    needs: validate
    if: inputs.deploy_changes && github.event_name != 'pull_request'
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      portal_image: ${{ steps.identities.outputs.portal }}
      provisioner_image: ${{ steps.identities.outputs.provisioner }}
      guacd_image: ${{ steps.identities.outputs.guacd }}
      guacamole_client_image: ${{ steps.identities.outputs.guacamole_client }}
      openvpn_image: ${{ steps.identities.outputs.openvpn }}
    env:
      GCP_ENVIRONMENT: ${{ inputs.environment }}
      USE_GKE_GCLOUD_AUTH_PLUGIN: "True"
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT || vars.GCP_SERVICE_ACCOUNT }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER || vars.GCP_WIF_PROVIDER }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Ensure GCP deploy auth is configured
        run: |
          if [ -z "${GCP_DEPLOY_SERVICE_ACCOUNT}" ] || [ -z "${GCP_WORKLOAD_IDENTITY_PROVIDER}" ]; then
            echo "::error::GCP_DEPLOY_SERVICE_ACCOUNT and GCP_WORKLOAD_IDENTITY_PROVIDER must be configured for gcp-dev deploys"
            exit 1
          fi
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          version: ">= 416.0.0"
          install_components: gke-gcloud-auth-plugin
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede
        with:
          version: v1.34.1
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Preflight - validate deploy prerequisites
        # Shared fail-safe gate (scripts/bootstrap/preflight.py): reports every
        # missing GitHub input at once before the adapter and the deploy command
        # run. The bootstrap operator credentials are required unless
        # SHIFTER_SKIP_OPERATOR_BOOTSTRAP=true. See docs/dev/deploy-secrets.md.
        working-directory: scripts/bootstrap
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          SHIFTER_CONFIG_GCP_DEV: ${{ secrets.SHIFTER_CONFIG_GCP_DEV }}
          GCP_PUBLIC_HOSTNAME: ${{ secrets.GCP_PUBLIC_HOSTNAME }}
          GCP_IDENTITY_ALLOWED_EMAIL_DOMAIN: ${{ secrets.GCP_IDENTITY_ALLOWED_EMAIL_DOMAIN }}
          GCP_BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.GCP_BOOTSTRAP_ADMIN_EMAIL }}
          GCP_BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.GCP_BOOTSTRAP_ADMIN_PASSWORD }}
          SHIFTER_SKIP_OPERATOR_BOOTSTRAP: ${{ vars.SHIFTER_SKIP_OPERATOR_BOOTSTRAP }}
        # The exact-release scanner validates its own identity inside the
        # separately protected release-scan Environment. This deploy-boundary
        # preflight must not require that identity to cross into the deploy job.
        run: uv run --frozen python -m preflight --cloud gcp --env "${GCP_ENVIRONMENT}" --component deploy --headless
      - name: Render deployment inputs
        env:
          SHIFTER_CONFIG_GCP_DEV: ${{ secrets.SHIFTER_CONFIG_GCP_DEV }}
          SHIFTER_CONFIG_OVERLAY_JSON: ${{ vars.SHIFTER_CONFIG_OVERLAY_JSON }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_PUBLIC_HOSTNAME: ${{ secrets.GCP_PUBLIC_HOSTNAME }}
          GCP_IDENTITY_ALLOWED_EMAIL_DOMAIN: ${{ secrets.GCP_IDENTITY_ALLOWED_EMAIL_DOMAIN }}
          GCP_CTF_CONTENT_BUCKET: ${{ vars.GCP_CTF_CONTENT_BUCKET }}
          RANGE_OPENVPN_ENABLED: ${{ vars.RANGE_OPENVPN_ENABLED }}
          GCP_RANGE_BACKEND: ${{ vars.GCP_RANGE_BACKEND }}
          RANGE_NETWORK_ZONE: ${{ vars.RANGE_NETWORK_ZONE }}
          RANGE_NETWORK_ZONES: ${{ vars.RANGE_NETWORK_ZONES }}
          GCP_RANGE_CELL_PROJECT_ID: ${{ vars.GCP_RANGE_CELL_PROJECT_ID }}
          GCP_RANGE_HOST_IDENTITY_POOL_SIZE: ${{ vars.GCP_RANGE_HOST_IDENTITY_POOL_SIZE }}
          GCP_RANGE_PRIVATE_GOOGLE_ACCESS: ${{ vars.GCP_RANGE_PRIVATE_GOOGLE_ACCESS }}
          GCP_RANGE_IMAGE_KEY_PROFILES_JSON: ${{ vars.GCP_RANGE_IMAGE_KEY_PROFILES_JSON || secrets.GCP_RANGE_IMAGE_KEY_PROFILES_JSON }}
          GCP_RANGE_LINUX_IMAGE: ${{ vars.GCP_RANGE_LINUX_IMAGE }}
          GCP_RANGE_KALI_IMAGE: ${{ vars.GCP_RANGE_KALI_IMAGE }}
          GCP_RANGE_WINDOWS_IMAGE: ${{ vars.GCP_RANGE_WINDOWS_IMAGE }}
          GCP_RANGE_DC_IMAGE: ${{ vars.GCP_RANGE_DC_IMAGE }}
          GCP_BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.GCP_BOOTSTRAP_ADMIN_EMAIL }}
          PLATFORM_BOOTSTRAP_STAFF_EMAILS: ${{ secrets.PLATFORM_BOOTSTRAP_STAFF_EMAILS }}
          PLATFORM_BOOTSTRAP_SUPERUSER_EMAILS: ${{ secrets.PLATFORM_BOOTSTRAP_SUPERUSER_EMAILS }}
          SHIFTER_SKIP_OPERATOR_BOOTSTRAP: ${{ vars.SHIFTER_SKIP_OPERATOR_BOOTSTRAP }}
          SMOKE_TEST_USER_EMAIL: ${{ secrets.SMOKE_TEST_USER_EMAIL }}
          GCP_FOUNDATION_INPUTS_JSON: ${{ vars.GCP_FOUNDATION_INPUTS_JSON }}
        # The bundle is a 0700 directory of 0600 files outside the checkout. The
        # last step of this job removes it.
        run: |
          set -euo pipefail
          inputs="${RUNNER_TEMP}/deployment-inputs"
          uv run --project scripts/gcp --frozen python scripts/gcp/render_ci_deployment_inputs.py \
            --environment "${GCP_ENVIRONMENT}" --output "${inputs}"
          echo "DEPLOYMENT_INPUTS=${inputs}" >> "${GITHUB_ENV}"
      - name: Run the infrastructure stage
        # Identity Platform, the hardened state bucket, Terraform, the range
        # audit telemetry check, and the first operator. The operator password
        # reaches the command only through the named environment variable.
        working-directory: scripts/bootstrap
        env:
          GCP_BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.GCP_BOOTSTRAP_ADMIN_PASSWORD }}
          RECONCILE_FOUNDATION: ${{ inputs.reconcile_foundation_image_network && github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          args=(
            gcp-deploy --inputs "${DEPLOYMENT_INPUTS}" --environment "${GCP_ENVIRONMENT}"
            --stage infrastructure --identity ambient --lock external
            --operator-password-env GCP_BOOTSTRAP_ADMIN_PASSWORD
            --image-roots-output "${RUNNER_TEMP}/image-roots.json"
          )
          if [ "${RECONCILE_FOUNDATION}" = "true" ]; then
            args+=(--reconcile-foundation-image-network)
          fi
          uv run --frozen python deploy.py "${args[@]}"
      - name: Export deployment image roots
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          roots = json.loads(Path(os.environ["RUNNER_TEMP"], "image-roots.json").read_text())
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env_file:
              env_file.write(f"PORTAL_IMAGE_ROOT={roots['portal']}\n")
              env_file.write(f"PROVISIONER_IMAGE_ROOT={roots['provisioner']}\n")
              env_file.write(f"GUACD_IMAGE_ROOT={roots['guacd']}\n")
              env_file.write(f"GUACAMOLE_CLIENT_IMAGE_ROOT={roots['guacamole-client']}\n")
              env_file.write(f"OPENVPN_IMAGE_ROOT={roots['openvpn']}\n")
              env_file.write(f"ARTIFACT_REGISTRY_HOST={roots['portal'].split('/')[0]}\n")
          PY
      - name: Login to Artifact Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.ARTIFACT_REGISTRY_HOST }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - name: Set short SHA
        run: echo "SHORT_SHA=$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build and push portal image
        id: build-portal
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: ./shifter
          file: ./shifter/shifter_platform/Dockerfile
          build-args: |
            SOURCE_REPOSITORY_URL=${{ github.server_url }}/${{ github.repository }}
          push: true
          tags: |
            ${{ env.PORTAL_IMAGE_ROOT }}:${{ env.SHORT_SHA }}
          no-cache: true
          # Build provenance (ADR-037-R5): SBOM + max provenance, attested below.
          provenance: mode=max
          sbom: true
      - name: Build and push provisioner image
        id: build-provisioner
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: ./shifter
          file: ./shifter/engine/provisioner/Dockerfile
          build-args: |
            SOURCE_REPOSITORY_URL=${{ github.server_url }}/${{ github.repository }}
          push: true
          tags: |
            ${{ env.PROVISIONER_IMAGE_ROOT }}:${{ env.SHORT_SHA }}
          no-cache: true
          provenance: mode=max
          sbom: true
      - name: Build and push guacd image
        id: build-guacd
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: ./shifter/engine/guacd
          push: true
          tags: |
            ${{ env.GUACD_IMAGE_ROOT }}:${{ env.SHORT_SHA }}
          no-cache: true
          provenance: mode=max
          sbom: true
      - name: Build and push guacamole-client image
        id: build-guacamole-client
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: ./shifter/engine/guacamole
          push: true
          tags: |
            ${{ env.GUACAMOLE_CLIENT_IMAGE_ROOT }}:${{ env.SHORT_SHA }}
          no-cache: true
          provenance: mode=max
          sbom: true
      - name: Build and push OpenVPN pool image
        id: build-openvpn
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: ./shifter/engine/openvpn
          build-args: |
            SOURCE_REPOSITORY_URL=${{ github.server_url }}/${{ github.repository }}
          push: true
          tags: |
            ${{ env.OPENVPN_IMAGE_ROOT }}:${{ env.SHORT_SHA }}
          no-cache: true
          provenance: mode=max
          sbom: true
      # The attestations are stored next to each image (push-to-registry), so the
      # deploy command verifies them with the Sigstore trust root and the
      # registry, without the GitHub API (ADR-037-R6, ADR-070).
      - name: Attest build provenance (portal)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.PORTAL_IMAGE_ROOT }}
          subject-digest: ${{ steps.build-portal.outputs.digest }}
          push-to-registry: true
      - name: Attest build provenance (provisioner)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.PROVISIONER_IMAGE_ROOT }}
          subject-digest: ${{ steps.build-provisioner.outputs.digest }}
          push-to-registry: true
      - name: Attest build provenance (guacd)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.GUACD_IMAGE_ROOT }}
          subject-digest: ${{ steps.build-guacd.outputs.digest }}
          push-to-registry: true
      - name: Attest build provenance (guacamole-client)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.GUACAMOLE_CLIENT_IMAGE_ROOT }}
          subject-digest: ${{ steps.build-guacamole-client.outputs.digest }}
          push-to-registry: true
      - name: Attest build provenance (openvpn)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.OPENVPN_IMAGE_ROOT }}
          subject-digest: ${{ steps.build-openvpn.outputs.digest }}
          push-to-registry: true
      - name: Export exact image identities
        id: identities
        env:
          PORTAL_IMAGE_DIGEST: ${{ steps.build-portal.outputs.digest }}
          PROVISIONER_IMAGE_DIGEST: ${{ steps.build-provisioner.outputs.digest }}
          GUACD_IMAGE_DIGEST: ${{ steps.build-guacd.outputs.digest }}
          GUACAMOLE_CLIENT_IMAGE_DIGEST: ${{ steps.build-guacamole-client.outputs.digest }}
          OPENVPN_IMAGE_DIGEST: ${{ steps.build-openvpn.outputs.digest }}
        run: |
          {
            echo "portal=${PORTAL_IMAGE_ROOT}@${PORTAL_IMAGE_DIGEST}"
            echo "provisioner=${PROVISIONER_IMAGE_ROOT}@${PROVISIONER_IMAGE_DIGEST}"
            echo "guacd=${GUACD_IMAGE_ROOT}@${GUACD_IMAGE_DIGEST}"
            echo "guacamole_client=${GUACAMOLE_CLIENT_IMAGE_ROOT}@${GUACAMOLE_CLIENT_IMAGE_DIGEST}"
            echo "openvpn=${OPENVPN_IMAGE_ROOT}@${OPENVPN_IMAGE_DIGEST}"
          } >> "${GITHUB_OUTPUT}"
      - name: Remove ephemeral deployment inputs
        if: always()
        run: rm -rf "${RUNNER_TEMP}/deployment-inputs" "${RUNNER_TEMP}/image-roots.json"

  release_scan:
    name: Scan exact release digests (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.release_scan_github_environment }}
    needs: [validate, prepare]
    if: inputs.deploy_changes && github.event_name != 'pull_request'
    permissions:
      contents: read
      id-token: write
    env:
      GCP_ENVIRONMENT: ${{ inputs.environment }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_RELEASE_SCAN_SERVICE_ACCOUNT: ${{ secrets.GCP_RELEASE_SCAN_SERVICE_ACCOUNT || vars.GCP_SERVICE_ACCOUNT }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER || vars.GCP_WIF_PROVIDER }}
      # The same Trivy release as the deployer image, so the CI and operator
      # scan gates run one scanner version.
      TRIVY_VERSION: 0.76.1
      # Reviewed from the upstream v0.76.1 release checksum manifest. Keeping
      # the expected digest in reviewed workflow code prevents a compromised
      # download origin from supplying both a binary and its replacement hash.
      TRIVY_ARCHIVE_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Ensure release-scan auth is configured
        run: |
          if [ -z "${GCP_RELEASE_SCAN_SERVICE_ACCOUNT}" ] || [ -z "${GCP_WORKLOAD_IDENTITY_PROVIDER}" ] || [ -z "${GCP_PROJECT_ID}" ]; then
            echo "::error::GCP_RELEASE_SCAN_SERVICE_ACCOUNT, GCP_WORKLOAD_IDENTITY_PROVIDER, and GCP_PROJECT_ID must be configured for exact-release scanning"
            exit 1
          fi
      - id: scan_auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_RELEASE_SCAN_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          version: ">= 416.0.0"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Install independently pinned Trivy
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "${RUNNER_TEMP}/trivy-bin"
          curl -fsSL -o "${RUNNER_TEMP}/trivy.tar.gz" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_ARCHIVE_SHA256}  ${RUNNER_TEMP}/trivy.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/trivy.tar.gz" -C "${RUNNER_TEMP}/trivy-bin" trivy
          echo "${RUNNER_TEMP}/trivy-bin" >> "${GITHUB_PATH}"
      - name: Write the CI release manifest
        env:
          PORTAL_IMAGE: ${{ needs.prepare.outputs.portal_image }}
          PROVISIONER_IMAGE: ${{ needs.prepare.outputs.provisioner_image }}
          GUACD_IMAGE: ${{ needs.prepare.outputs.guacd_image }}
          GUACAMOLE_CLIENT_IMAGE: ${{ needs.prepare.outputs.guacamole_client_image }}
          OPENVPN_IMAGE: ${{ needs.prepare.outputs.openvpn_image }}
        run: |
          set -euo pipefail
          chart_version="$(awk '/^version:/ {print $2; exit}' platform/charts/shifter/Chart.yaml)"
          uv run --project shifter/installation --frozen shifter-config gcp-release-manifest \
            --version "ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --source-revision "${GITHUB_SHA}" \
            --chart-version "${chart_version}" \
            --image "portal=${PORTAL_IMAGE}" \
            --image "provisioner=${PROVISIONER_IMAGE}" \
            --image "guacd=${GUACD_IMAGE}" \
            --image "guacamole-client=${GUACAMOLE_CLIENT_IMAGE}" \
            --image "openvpn=${OPENVPN_IMAGE}" \
            > "${RUNNER_TEMP}/release.json"
      - name: Scan exact release image digests
        # HIGH and CRITICAL findings block the rollout. The command writes the raw
        # evidence and the redacted verdict to the private release-evidence bucket.
        working-directory: scripts/bootstrap
        run: |
          uv run --frozen python deploy.py gcp-release-scan \
            --release-manifest "${RUNNER_TEMP}/release.json" \
            --project-id "${GCP_PROJECT_ID}" --environment "${GCP_ENVIRONMENT}" \
            --identity ambient --run-id "${GITHUB_RUN_ID}" --attempt "${GITHUB_RUN_ATTEMPT}"
      - name: Remove exact-release scan material
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/trivy.tar.gz" "${RUNNER_TEMP}/trivy-bin/trivy" "${RUNNER_TEMP}/release.json"
          rmdir "${RUNNER_TEMP}/trivy-bin" 2>/dev/null || true

  deploy:
    name: Deploy verified release (${{ inputs.environment }})
    runs-on: ${{ inputs.environment }}
    environment: ${{ inputs.github_environment }}
    needs: [validate, prepare, release_scan]
    if: inputs.deploy_changes && github.event_name != 'pull_request'
    permissions:
      contents: read
      id-token: write
    env:
      GCP_ENVIRONMENT: ${{ inputs.environment }}
      USE_GKE_GCLOUD_AUTH_PLUGIN: "True"
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT || vars.GCP_SERVICE_ACCOUNT }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER || vars.GCP_WIF_PROVIDER }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Install Helm for canonical chart rendering (hermetic, version-pinned, checksum-verified)
        env:
          # The same Helm release as the deployer image. Its chart renders are
          # byte-identical to the v3.15.4 renders that the chart tests freeze.
          HELM_VERSION: v3.22.1
          # Reviewed, digest-pinned SHA-256 of helm-v3.22.1-linux-amd64.tar.gz.
          # Pinned in reviewed repo content rather than fetched from get.helm.sh
          # (the same mutable origin as the binary), so a compromised release
          # bucket/CDN/publishing credential cannot supply a matching checksum
          # for a tampered tarball. Bump both fields together on a Helm upgrade.
          HELM_SHA256: 896cf63684a42a723d61c980369d6e588330927deb13676ca0d85006dd6da0ea
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/helm-bin"
          curl -fsSL -o "${RUNNER_TEMP}/helm.tar.gz" \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  ${RUNNER_TEMP}/helm.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/helm.tar.gz" -C "${RUNNER_TEMP}" linux-amd64/helm
          mv "${RUNNER_TEMP}/linux-amd64/helm" "${RUNNER_TEMP}/helm-bin/helm"
          echo "${RUNNER_TEMP}/helm-bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/helm-bin/helm" version --short
      - name: Ensure GCP deploy auth is configured
        run: |
          if [ -z "${GCP_DEPLOY_SERVICE_ACCOUNT}" ] || [ -z "${GCP_WORKLOAD_IDENTITY_PROVIDER}" ]; then
            echo "::error::GCP_DEPLOY_SERVICE_ACCOUNT and GCP_WORKLOAD_IDENTITY_PROVIDER must be configured for gcp-dev deploys"
            exit 1
          fi
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          version: ">= 416.0.0"
          install_components: gke-gcloud-auth-plugin
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede
        with:
          version: v1.34.1
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false
      - name: Render deployment inputs
        env:
          SHIFTER_CONFIG_GCP_DEV: ${{ secrets.SHIFTER_CONFIG_GCP_DEV }}
          SHIFTER_CONFIG_OVERLAY_JSON: ${{ vars.SHIFTER_CONFIG_OVERLAY_JSON }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_PUBLIC_HOSTNAME: ${{ secrets.GCP_PUBLIC_HOSTNAME }}
          GCP_IDENTITY_ALLOWED_EMAIL_DOMAIN: ${{ secrets.GCP_IDENTITY_ALLOWED_EMAIL_DOMAIN }}
          GCP_CTF_CONTENT_BUCKET: ${{ vars.GCP_CTF_CONTENT_BUCKET }}
          RANGE_OPENVPN_ENABLED: ${{ vars.RANGE_OPENVPN_ENABLED }}
          GCP_RANGE_BACKEND: ${{ vars.GCP_RANGE_BACKEND }}
          RANGE_NETWORK_ZONE: ${{ vars.RANGE_NETWORK_ZONE }}
          RANGE_NETWORK_ZONES: ${{ vars.RANGE_NETWORK_ZONES }}
          GCP_RANGE_CELL_PROJECT_ID: ${{ vars.GCP_RANGE_CELL_PROJECT_ID }}
          GCP_RANGE_HOST_IDENTITY_POOL_SIZE: ${{ vars.GCP_RANGE_HOST_IDENTITY_POOL_SIZE }}
          GCP_RANGE_PRIVATE_GOOGLE_ACCESS: ${{ vars.GCP_RANGE_PRIVATE_GOOGLE_ACCESS }}
          GCP_RANGE_IMAGE_KEY_PROFILES_JSON: ${{ vars.GCP_RANGE_IMAGE_KEY_PROFILES_JSON || secrets.GCP_RANGE_IMAGE_KEY_PROFILES_JSON }}
          GCP_RANGE_LINUX_IMAGE: ${{ vars.GCP_RANGE_LINUX_IMAGE }}
          GCP_RANGE_KALI_IMAGE: ${{ vars.GCP_RANGE_KALI_IMAGE }}
          GCP_RANGE_WINDOWS_IMAGE: ${{ vars.GCP_RANGE_WINDOWS_IMAGE }}
          GCP_RANGE_DC_IMAGE: ${{ vars.GCP_RANGE_DC_IMAGE }}
          GCP_BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.GCP_BOOTSTRAP_ADMIN_EMAIL }}
          PLATFORM_BOOTSTRAP_STAFF_EMAILS: ${{ secrets.PLATFORM_BOOTSTRAP_STAFF_EMAILS }}
          PLATFORM_BOOTSTRAP_SUPERUSER_EMAILS: ${{ secrets.PLATFORM_BOOTSTRAP_SUPERUSER_EMAILS }}
          SHIFTER_SKIP_OPERATOR_BOOTSTRAP: ${{ vars.SHIFTER_SKIP_OPERATOR_BOOTSTRAP }}
          SMOKE_TEST_USER_EMAIL: ${{ secrets.SMOKE_TEST_USER_EMAIL }}
          GCP_FOUNDATION_INPUTS_JSON: ${{ vars.GCP_FOUNDATION_INPUTS_JSON }}
        run: |
          set -euo pipefail
          inputs="${RUNNER_TEMP}/deployment-inputs"
          uv run --project scripts/gcp --frozen python scripts/gcp/render_ci_deployment_inputs.py \
            --environment "${GCP_ENVIRONMENT}" --output "${inputs}"
          echo "DEPLOYMENT_INPUTS=${inputs}" >> "${GITHUB_ENV}"
      - name: Write the CI release manifest
        env:
          PORTAL_IMAGE: ${{ needs.prepare.outputs.portal_image }}
          PROVISIONER_IMAGE: ${{ needs.prepare.outputs.provisioner_image }}
          GUACD_IMAGE: ${{ needs.prepare.outputs.guacd_image }}
          GUACAMOLE_CLIENT_IMAGE: ${{ needs.prepare.outputs.guacamole_client_image }}
          OPENVPN_IMAGE: ${{ needs.prepare.outputs.openvpn_image }}
        run: |
          set -euo pipefail
          chart_version="$(awk '/^version:/ {print $2; exit}' platform/charts/shifter/Chart.yaml)"
          uv run --project shifter/installation --frozen shifter-config gcp-release-manifest \
            --version "ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --source-revision "${GITHUB_SHA}" \
            --chart-version "${chart_version}" \
            --image "portal=${PORTAL_IMAGE}" \
            --image "provisioner=${PROVISIONER_IMAGE}" \
            --image "guacd=${GUACD_IMAGE}" \
            --image "guacamole-client=${GUACAMOLE_CLIENT_IMAGE}" \
            --image "openvpn=${OPENVPN_IMAGE}" \
            > "${RUNNER_TEMP}/release.json"
      - name: Run the rollout stage
        # Provenance verification bound to this repository's immutable IDs and the
        # source revision, the Helm release, the migrations, the secret syncs, the
        # rollout waits, the running-image evidence, and the ingress and
        # certificate waits. The rollout stops on the first failure.
        working-directory: scripts/bootstrap
        env:
          TRUSTED_REPOSITORY_ID: ${{ github.repository_id }}
          TRUSTED_OWNER_ID: ${{ github.repository_owner_id }}
          REQUIRE_ACTIVE_CERTIFICATE: ${{ inputs.require_active_certificate }}
          IDENTITY_CUTOVER_FACTS_JSON: ${{ secrets.IDENTITY_CUTOVER_FACTS_JSON }}
          IDENTITY_BOOTSTRAP_FACTS_JSON: ${{ secrets.IDENTITY_BOOTSTRAP_FACTS_JSON }}
          CATALOG_CREDENTIAL: ${{ secrets.CATALOG_CREDENTIAL }}
        run: |
          set -euo pipefail
          umask 077
          cutover_facts="${RUNNER_TEMP}/identity-cutover-facts.json"
          bootstrap_facts="${RUNNER_TEMP}/identity-bootstrap-facts.json"
          catalog_credential="${RUNNER_TEMP}/catalog-credential"
          trap 'rm -f "${cutover_facts}" "${bootstrap_facts}" "${catalog_credential}"' EXIT
          if { [ -n "${IDENTITY_CUTOVER_FACTS_JSON}" ] && [ -z "${IDENTITY_BOOTSTRAP_FACTS_JSON}" ]; } || \
             { [ -z "${IDENTITY_CUTOVER_FACTS_JSON}" ] && [ -n "${IDENTITY_BOOTSTRAP_FACTS_JSON}" ]; }; then
            echo "::error::Identity cutover and bootstrap facts must be supplied together."
            exit 1
          fi
          args=(
            gcp-deploy --inputs "${DEPLOYMENT_INPUTS}" --environment "${GCP_ENVIRONMENT}"
            --stage rollout --identity ambient --lock external
            --release-manifest "${RUNNER_TEMP}/release.json"
            --trusted-repository-id "${TRUSTED_REPOSITORY_ID}" --trusted-owner-id "${TRUSTED_OWNER_ID}"
            --run-id "${GITHUB_RUN_ID}" --attempt "${GITHUB_RUN_ATTEMPT}"
          )
          if [ "${REQUIRE_ACTIVE_CERTIFICATE}" != "true" ]; then
            args+=(--first-install)
          fi
          if [ -n "${IDENTITY_CUTOVER_FACTS_JSON}" ]; then
            printf '%s' "${IDENTITY_CUTOVER_FACTS_JSON}" > "${cutover_facts}"
            printf '%s' "${IDENTITY_BOOTSTRAP_FACTS_JSON}" > "${bootstrap_facts}"
            chmod 600 "${cutover_facts}" "${bootstrap_facts}"
            args+=(--identity-cutover-facts "${cutover_facts}" --identity-bootstrap-facts "${bootstrap_facts}")
          fi
          if [ -n "${CATALOG_CREDENTIAL}" ]; then
            printf '%s' "${CATALOG_CREDENTIAL}" > "${catalog_credential}"
            chmod 600 "${catalog_credential}"
            args+=(--catalog-credential-file "${catalog_credential}")
          fi
          unset IDENTITY_CUTOVER_FACTS_JSON IDENTITY_BOOTSTRAP_FACTS_JSON CATALOG_CREDENTIAL
          uv run --frozen python deploy.py "${args[@]}"
      - name: Remove ephemeral deployment inputs
        if: always()
        run: rm -rf "${RUNNER_TEMP}/deployment-inputs" "${RUNNER_TEMP}/release.json"

  post-deploy-smoke:
    permissions:
      id-token: write
      contents: read
      issues: write
    name: Post-deploy smoke (${{ inputs.environment }})
    runs-on: ${{ inputs.environment }}
    # Backstop only (see #1220).
    timeout-minutes: 60
    environment: ${{ inputs.github_environment }}
    needs: deploy
    if: |
      inputs.deploy_changes &&
      github.event_name != 'pull_request' &&
      needs.deploy.result == 'success'
    continue-on-error: true
    env:
      GCP_ENVIRONMENT: ${{ inputs.environment }}
      USE_GKE_GCLOUD_AUTH_PLUGIN: "True"
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT || vars.GCP_SERVICE_ACCOUNT }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER || vars.GCP_WIF_PROVIDER }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Ensure GCP deploy auth is configured
        run: |
          if [ -z "${GCP_DEPLOY_SERVICE_ACCOUNT}" ] || [ -z "${GCP_WORKLOAD_IDENTITY_PROVIDER}" ]; then
            echo "::error::GCP_DEPLOY_SERVICE_ACCOUNT and GCP_WORKLOAD_IDENTITY_PROVIDER must be configured for gcp-dev smoke"
            exit 1
          fi
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          version: ">= 416.0.0"
          install_components: gke-gcloud-auth-plugin
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede
        with:
          version: v1.34.1
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Render deployment inputs
        env:
          SHIFTER_CONFIG_GCP_DEV: ${{ secrets.SHIFTER_CONFIG_GCP_DEV }}
          SHIFTER_CONFIG_OVERLAY_JSON: ${{ vars.SHIFTER_CONFIG_OVERLAY_JSON }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_PUBLIC_HOSTNAME: ${{ secrets.GCP_PUBLIC_HOSTNAME }}
          GCP_IDENTITY_ALLOWED_EMAIL_DOMAIN: ${{ secrets.GCP_IDENTITY_ALLOWED_EMAIL_DOMAIN }}
          GCP_CTF_CONTENT_BUCKET: ${{ vars.GCP_CTF_CONTENT_BUCKET }}
          RANGE_OPENVPN_ENABLED: ${{ vars.RANGE_OPENVPN_ENABLED }}
          GCP_RANGE_BACKEND: ${{ vars.GCP_RANGE_BACKEND }}
          RANGE_NETWORK_ZONE: ${{ vars.RANGE_NETWORK_ZONE }}
          RANGE_NETWORK_ZONES: ${{ vars.RANGE_NETWORK_ZONES }}
          GCP_RANGE_CELL_PROJECT_ID: ${{ vars.GCP_RANGE_CELL_PROJECT_ID }}
          GCP_RANGE_HOST_IDENTITY_POOL_SIZE: ${{ vars.GCP_RANGE_HOST_IDENTITY_POOL_SIZE }}
          GCP_RANGE_PRIVATE_GOOGLE_ACCESS: ${{ vars.GCP_RANGE_PRIVATE_GOOGLE_ACCESS }}
          GCP_RANGE_IMAGE_KEY_PROFILES_JSON: ${{ vars.GCP_RANGE_IMAGE_KEY_PROFILES_JSON || secrets.GCP_RANGE_IMAGE_KEY_PROFILES_JSON }}
          GCP_RANGE_LINUX_IMAGE: ${{ vars.GCP_RANGE_LINUX_IMAGE }}
          GCP_RANGE_KALI_IMAGE: ${{ vars.GCP_RANGE_KALI_IMAGE }}
          GCP_RANGE_WINDOWS_IMAGE: ${{ vars.GCP_RANGE_WINDOWS_IMAGE }}
          GCP_RANGE_DC_IMAGE: ${{ vars.GCP_RANGE_DC_IMAGE }}
          GCP_BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.GCP_BOOTSTRAP_ADMIN_EMAIL }}
          PLATFORM_BOOTSTRAP_STAFF_EMAILS: ${{ secrets.PLATFORM_BOOTSTRAP_STAFF_EMAILS }}
          PLATFORM_BOOTSTRAP_SUPERUSER_EMAILS: ${{ secrets.PLATFORM_BOOTSTRAP_SUPERUSER_EMAILS }}
          SHIFTER_SKIP_OPERATOR_BOOTSTRAP: ${{ vars.SHIFTER_SKIP_OPERATOR_BOOTSTRAP }}
          SMOKE_TEST_USER_EMAIL: ${{ secrets.SMOKE_TEST_USER_EMAIL }}
          GCP_FOUNDATION_INPUTS_JSON: ${{ vars.GCP_FOUNDATION_INPUTS_JSON }}
        run: |
          set -euo pipefail
          inputs="${RUNNER_TEMP}/deployment-inputs"
          uv run --project scripts/gcp --frozen python scripts/gcp/render_ci_deployment_inputs.py \
            --environment "${GCP_ENVIRONMENT}" --output "${inputs}"
          echo "DEPLOYMENT_INPUTS=${inputs}" >> "${GITHUB_ENV}"
      - name: Run linux post-deploy smoke
        id: smoke
        continue-on-error: true
        working-directory: scripts/bootstrap
        env:
          SMOKE_TEST_USER_EMAIL: ${{ secrets.SMOKE_TEST_USER_EMAIL }}
        # The CI smoke requires its identity; an empty value fails this step and
        # opens the smoke issue, as before. The command reads the value from the
        # rendered inputs, not from this variable.
        run: |
          set -euo pipefail
          if [ -z "${SMOKE_TEST_USER_EMAIL}" ]; then
            echo "::error::SMOKE_TEST_USER_EMAIL is required for the CI post-deploy smoke"
            exit 1
          fi
          uv run --frozen python deploy.py gcp-smoke --inputs "${DEPLOYMENT_INPUTS}" \
            --environment "${GCP_ENVIRONMENT}" --identity ambient \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Remove ephemeral deployment inputs
        if: always()
        run: rm -rf "${RUNNER_TEMP}/deployment-inputs"

      - name: Open smoke failure issue
        if: steps.smoke.outcome == 'failure'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const title = `[smoke-test][${process.env.GCP_ENVIRONMENT}][linux] ${context.sha.slice(0, 12)}`;
            const body = [
              '## Post-deploy smoke test failed',
              '',
              `- Environment: \`${process.env.GCP_ENVIRONMENT}\``,
              `- Provider: \`gcp\``,
              `- Variant: \`linux\``,
              `- Commit: \`${context.sha}\``,
              `- Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'See the **Run linux post-deploy smoke** step logs for details.',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['bug', 'smoke-test'],
            });

      - name: Fail smoke job after issue creation
        if: steps.smoke.outcome == 'failure'
        run: |
          echo "::warning::Post-deploy smoke failed; issue opened and deploy was not blocked (continue-on-error)."
          exit 1
