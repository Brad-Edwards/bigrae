  bootstrap-tests:
    permissions:
      contents: read
    name: Tests (bootstrap)
    needs: [paths, bootstrap-lint]
    if: ${{ !inputs.skip_tests && ((needs.paths.outputs.run_all == 'true' || needs.paths.outputs.bootstrap == 'true')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install Helm to render the chart (hermetic, version-pinned, checksum-verified)
        env:
          HELM_VERSION: v3.15.4
          # Reviewed, digest-pinned SHA-256 of helm-v3.15.4-linux-amd64.tar.gz.
          # Pinned in reviewed repo content rather than fetched from get.helm.sh
          # (the same mutable origin as the binary), so a compromised release
          # bucket/CDN/publishing credential cannot supply a matching checksum
          # for a tampered tarball. Bump both fields together on a Helm upgrade.
          HELM_SHA256: 11400fecfc07fd6f034863e4e0c4c4445594673fd2a129e701fe41f31170cfa9
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/helm-bin"
          curl -fsSL -o "${RUNNER_TEMP}/helm.tar.gz" \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  ${RUNNER_TEMP}/helm.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/helm.tar.gz" -C "${RUNNER_TEMP}" linux-amd64/helm
          mv "${RUNNER_TEMP}/linux-amd64/helm" "${RUNNER_TEMP}/helm-bin/helm"
          echo "${RUNNER_TEMP}/helm-bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/helm-bin/helm" version --short

      - name: Verify integration prerequisites
        run: |
          helm version --short
          openssl version

      - name: Install dependencies
        working-directory: scripts/bootstrap
        run: uv sync --group dev

      - name: Run tests
        working-directory: scripts/bootstrap
        run: uv run --with pytest-cov pytest tests/ -m "integration or not integration" --cov --cov-report=xml:coverage.xml

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-bootstrap
          path: scripts/bootstrap/coverage.xml
          if-no-files-found: error
          retention-days: 1

