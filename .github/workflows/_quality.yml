      - name: Run migration proof
        working-directory: shifter/shifter_platform
        run: uv run pytest engine/tests/test_subnet_allocation_migrations_postgres.py

  guacd-image-tests:
    permissions:
      contents: read
    name: Tests (guacd image)
    needs: [paths]
    if: ${{ !inputs.skip_tests && (needs.paths.outputs.run_all == 'true' || needs.paths.outputs.container_images == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Build and test runtime permissions and health
        run: |
          set -euo pipefail
          docker build --pull --tag guacd-quality shifter/engine/guacd
          docker run --rm --network none --entrypoint /bin/sh guacd-quality -ec \
            'test "$(id -u)" -ne 0; test -w /var/lib/guacamole/drive; test "$(stat -c %a /var/lib/guacamole/drive)" = 750'
          trap 'docker rm -f guacd-quality >/dev/null 2>&1 || true' EXIT
          # Run with the Kubernetes posture: read-only root, no capabilities.
          docker run --detach --network none --read-only --cap-drop ALL --tmpfs /tmp \
            --tmpfs /var/lib/guacamole/drive:uid=1000,gid=1000,mode=0750 \
            --name guacd-quality guacd-quality
          for _attempt in $(seq 1 30); do
            if docker exec guacd-quality nc -z 127.0.0.1 4822; then
              exit 0
            fi
            sleep 1
          done
          echo 'guacd did not become ready' >&2
          exit 1

      - name: Test database initialization failure
        run: bash shifter/engine/guacamole/test-entrypoint.sh

      - name: Test the bundled jar replacement
        working-directory: shifter/engine/guacamole
        run: python3 -m unittest test_patch_bundled_jars -v

  adr-guard-tests:
    permissions:
      contents: read
    name: Tests (adr_guard)
    needs: [paths, adr-conformance]
    # guard_selfcheck (independent of the classifier) forces the guard's own
    # tests to run on any contract/classifier/guard-file change (#1530).
    if: ${{ !inputs.skip_tests && ((needs.paths.outputs.run_all == 'true' || needs.paths.outputs.adr_guard == 'true' || needs.paths.outputs.guard_selfcheck == 'true')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Same rationale as adr-conformance: `adr_guard` imports `tomllib`
      # (stdlib 3.11+); the self-hosted runner ships 3.9. Use `uv` to
      # source Python so the workflow doesn't depend on a system upgrade.
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Run tests
        run: |
          uv run --python 3.11 --with 'pyyaml==6.0.2' --with coverage \
            coverage run --source=scripts/adr_guard --omit='scripts/adr_guard/tests/*' \
              -m unittest discover -s scripts/adr_guard/tests -p 'test_*.py' -v
          uv run --python 3.11 --with coverage coverage xml -o scripts/adr_guard/coverage.xml

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-adr-guard
          path: scripts/adr_guard/coverage.xml

  # ===========================================================================
