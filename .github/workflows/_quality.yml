      - name: Check the image locks match uv.lock
        run: |
          python3 -m unittest scripts.check_provisioner_locks.test_check_provisioner_locks
          python3 scripts/check_provisioner_locks/check_provisioner_locks.py

      - name: Run tests
        working-directory: shifter/engine/provisioner
