        run: uv run --with pytest-cov pytest tests/ --cov --cov-report=xml:coverage.xml

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
