          name: coverage-guacamole-authority
          path: shifter/engine/guacamole/authority-extension/target/site/jacoco/jacoco.xml
          if-no-files-found: error
          retention-days: 1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Install native qualification dependencies
        working-directory: shifter/shifter_platform
        run: uv sync --group dev
      - name: Build local synthetic gateway and RDP guest
        run: |
          docker build -t shifter-guacamole-2319-local:latest shifter/engine/guacamole
          docker build -t shifter-guacd-202-local:latest shifter/engine/guacd
          docker build -t shifter-synthetic-rdp-2319:latest shifter/shifter_platform/tests/integration/guacamole-rdp
      - name: Qualify real SSH, SFTP and RDP closure
        working-directory: shifter/shifter_platform
        env:
          TESTING: "1"
          TEST_DB_BACKEND: sqlite
          GUACAMOLE_NATIVE_INTEGRATION: "1"
          GUACAMOLE_EXTENSION_IMAGE: shifter-guacamole-2319-local:latest
