  shifter-platform-sast:
    permissions:
      contents: read
    name: SAST (shifter_platform)
    needs: [paths]
    if: ${{ (needs.paths.outputs.run_all == 'true' || needs.paths.outputs.shifter_platform == 'true') }}
    runs-on: ubuntu-latest
