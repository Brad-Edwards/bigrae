      - name: Test
        working-directory: mcp/${{ matrix.package }}
        run: npm test

  # ===========================================================================
  # Security
  # ===========================================================================

  security-iac:
    permissions:
      contents: read
    name: Security (IaC)
    needs: [paths]
    if: ${{ (needs.paths.outputs.run_all == 'true' || needs.paths.outputs.terraform == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Cache Checkov
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.local
          key: ${{ runner.os }}-checkov-${{ hashFiles('.github/workflows/_quality.yml') }}
          restore-keys: |
            ${{ runner.os }}-checkov-

      - name: Test Checkov immutable subject compatibility
        run: >-
          docker run --rm --network none
          --volume "${GITHUB_WORKSPACE}:/workspace:ro" --workdir /workspace
          --entrypoint python
          ghcr.io/bridgecrewio/checkov@sha256:4c2c3b67f09867ef2843a03d8ba82adf712eb93ea3584c1708c24ed584f6da17
          -m unittest scripts.check_checkov_invocation_parity.test_immutable_subjects -q

      - name: Checkov IaC Security
        # Blocking gate per ADR-004-R11. Skip-check entries live in
        # platform/terraform/.checkov.yaml so this job consumes the canonical
        # policy boundary. Accepted-risk
        # waivers are documented in docs/adr/exceptions.yaml with owner,
        # reason, expires_on, and affected paths.
        uses: bridgecrewio/checkov-action@02a4c5d6a02367e5ea493c34c26b094302fd3f61 # v12
        with:
          directory: platform/terraform/
          config_file: platform/terraform/.checkov.yaml
          download_external_modules: true
          external_checks_dirs: scripts/check_checkov_invocation_parity/compat
          soft_fail: false

  security-k8s:
    permissions:
      contents: read
    name: Security (k8s)
    needs: [paths]
    if: ${{ (needs.paths.outputs.run_all == 'true' || needs.paths.outputs.charts == 'true') }}
    runs-on: ubuntu-latest
    # K8s Checkov is a separate blocking policy surface from Terraform Checkov
    # (per ADR-004-R11). Both fail closed. Do NOT reintroduce continue-on-error
    # or soft_fail: fix the finding, or record a scoped, factual exception in
    # docs/adr/exceptions.yaml with a resource annotation. The Helm chart is the
    # only Kubernetes renderer (ADR-007, #2571), so Checkov scans the rendered
    # chart for every supported profile.
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Helm (hermetic, version-pinned, checksum-verified)
        env:
          HELM_VERSION: v3.15.4
          HELM_SHA256: 11400fecfc07fd6f034863e4e0c4c4445594673fd2a129e701fe41f31170cfa9
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/helm-bin"
          curl -fsSL -o "${RUNNER_TEMP}/helm.tar.gz" \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  ${RUNNER_TEMP}/helm.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/helm.tar.gz" -C "${RUNNER_TEMP}" linux-amd64/helm
          mv "${RUNNER_TEMP}/linux-amd64/helm" "${RUNNER_TEMP}/helm-bin/helm"
          echo "${RUNNER_TEMP}/helm-bin" >> "${GITHUB_PATH}"

      # The Checkov action runs in a container that mounts the workspace, so the
      # renders go to a workspace directory.
      - name: Render every supported profile
        run: |
          set -euo pipefail
          mkdir -p rendered-chart
          for values in values.yaml values-aws-dev.yaml values-aws-prod.yaml values-gcp-dev.yaml values-gcp-prod.yaml; do
            helm template quality-check platform/charts/shifter \
              -f "platform/charts/shifter/${values}" \
              > "rendered-chart/${values}"
          done

      - name: Cache Checkov
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.local
          key: ${{ runner.os }}-checkov-k8s-${{ hashFiles('.github/workflows/_quality.yml') }}
          restore-keys: |
            ${{ runner.os }}-checkov-k8s-

      - name: Checkov k8s Security
        uses: bridgecrewio/checkov-action@02a4c5d6a02367e5ea493c34c26b094302fd3f61 # v12
        with:
          directory: rendered-chart/
          framework: kubernetes
          quiet: true
          compact: true
          soft_fail: false

  # Repository configuration remains advisory here. Exact release OCI digests
  # are scanned as a blocking deploy gate by deploy.py gcp-release-scan (#2084,
  # #2571).
  security-trivy-advisory:
    permissions:
      contents: read
    name: Security (trivy advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Trivy (hermetic, version-pinned, checksum-verified)
        env:
          TRIVY_VERSION: 0.71.2
          TRIVY_SHA256: 0510e71e2fd39bf863856d499c8dc19feb4e7336546394c502a8f5cc7ab27460
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/trivy-bin"
          curl -fsSL -o "${RUNNER_TEMP}/trivy.tar.gz" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  ${RUNNER_TEMP}/trivy.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/trivy.tar.gz" -C "${RUNNER_TEMP}/trivy-bin" trivy
          echo "${RUNNER_TEMP}/trivy-bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/trivy-bin/trivy" --version

      - name: Scan first-party Dockerfiles and Terraform (advisory)
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/trivy-results"
          # Trivy config accepts one target root per invocation. Scan each
          # first-party tree separately (skip temp/ via path exclusion).
          for target in shifter/engine shifter/shifter_platform shifter/packer; do
            slug=$(echo "$target" | tr '/' '-')
            trivy config \
              --exit-code 0 \
              --format sarif \
              --output "${RUNNER_TEMP}/trivy-results/${slug}.sarif" \
              --skip-dirs '**/temp/**' \
              "$target"
          done
          trivy config \
            --exit-code 0 \
            --format sarif \
            --output "${RUNNER_TEMP}/trivy-results/terraform.sarif" \
            platform/terraform/

      - name: Upload Trivy SARIF artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-advisory-sarif
          path: ${{ runner.temp }}/trivy-results/*.sarif
          if-no-files-found: error
          retention-days: 14

  security-osv-advisory:
    permissions:
      contents: read
    name: Security (osv-scanner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install OSV-Scanner (hermetic, version-pinned, checksum-verified)
        env:
          OSV_VERSION: v2.4.0
          OSV_SHA256: 15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/osv-bin"
          curl -fsSL -o "${RUNNER_TEMP}/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  ${RUNNER_TEMP}/osv-scanner" | sha256sum -c -
          chmod +x "${RUNNER_TEMP}/osv-scanner"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/osv-scanner" --version

      - name: Scan every owned lockfile
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/osv-results"
          scan_status=0
          lock_count=0
          while IFS= read -r -d '' lockfile; do
            lock_count=$((lock_count + 1))
            slug=$(printf '%s' "${lockfile#./}" | tr '/.' '--')
            sarif_out="${RUNNER_TEMP}/osv-results/${slug}.sarif"
            if ! osv-scanner scan source \
              --experimental-no-default-plugins \
              --experimental-plugins lockfile \
              --config="${GITHUB_WORKSPACE}/osv-scanner.toml" \
              --lockfile="${lockfile}" \
              --format sarif \
              --output-file "${sarif_out}"; then
              scan_status=1
            fi
          done < <(
            {
              find . -name package-lock.json -not -path '*/node_modules/*' -print0
              find . -name uv.lock -not -path '*/.venv/*' -print0
            } | sort -z
          )
          if [ "${lock_count}" -eq 0 ]; then
            echo "::error::No owned lockfiles were discovered"
            exit 1
          fi
          exit "${scan_status}"

      - name: Upload OSV-Scanner SARIF artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: osv-scanner-sarif
          path: ${{ runner.temp }}/osv-results/*.sarif
          if-no-files-found: error
          retention-days: 14

  secrets-gitleaks:
    permissions:
      contents: read
    name: Security (gitleaks)
    needs: [paths]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Determine scan range
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          else
            RANGE="HEAD~1..HEAD"
          fi
          echo "log_opts=$RANGE" >> "$GITHUB_OUTPUT"

      - name: Run gitleaks on new commits
        uses: DariuszPorowski/github-action-gitleaks@a027585cb1f2780aa441f20f4d0aabf8b1a0d90e # v2.1.0
        with:
          config: .gitleaks.toml
          fail: true
          report_format: json
          log_opts: ${{ steps.range.outputs.log_opts }}

  model-fks-arch:
    permissions:
      contents: read
    name: Architecture (model FKs)
    needs: [paths]
    if: ${{ (needs.paths.outputs.run_all == 'true' || needs.paths.outputs.shifter_platform == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install dependencies
        working-directory: shifter/shifter_platform
        run: uv sync --group dev

      # check_model_fks introspects Django model metadata only — it never opens a
      # database connection. Explicit SQLite selection (#1524), no PostgreSQL
      # service or DB_* bundle (the previous postgres:16 service sat idle).
      - name: Check model FKs
        working-directory: shifter/shifter_platform
        env:
          TESTING: "1"
          TEST_DB_BACKEND: sqlite
          DJANGO_DEBUG: "true"
          DJANGO_SECRET_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
        run: uv run python manage.py check_model_fks

  # ===========================================================================
  # Built-image stack smoke (#922)
  #
  # Boots the *production* portal image under its real entrypoint.sh against
  # local Postgres / Redis / ElasticMQ doubles and asserts /health readiness,
  # an authenticated websocket handshake, and worker/scheduler heartbeats. This
  # catches container-runtime regressions (the June-7 /home/appuser and worker
  # healthcheck failures) that the source-tree pytest estate cannot see. Gated
  # on `run_stack_smoke`, which the caller drives from the portal_image /
  # shifter_platform path filters, so it only builds the image when the image's
  # inputs change. Hosted runner, no cloud credentials.
  # ===========================================================================

  stack-smoke:
    permissions:
      contents: read
    name: Stack smoke (built image)
    needs: [paths]
    # The caller sets run_stack_smoke when the portal image inputs change. The
    # inner gate must accept the same owners (shifter_platform, installation),
    # or a portal-only change skips the built-image smoke (#1698).
    if: ${{ inputs.run_stack_smoke && !inputs.skip_tests && (needs.paths.outputs.run_all == 'true' || needs.paths.outputs.stack_smoke == 'true' || needs.paths.outputs.portal_image_context == 'true' || needs.paths.outputs.shifter_platform == 'true' || needs.paths.outputs.installation == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Boot built portal image and assert health/WS/workers
        run: bash scripts/stack-smoke/stack_smoke.sh

  # ===========================================================================
  # Static analysis — SonarCloud
  # ===========================================================================

  sonarcloud:
    permissions:
      contents: read
    name: SonarCloud
    # Runs after the test jobs so their coverage reports can feed the scan.
    # success() keeps the implicit needs-passed guard that a custom if:
    # would otherwise drop; skipped when tests are skipped.
    if: ${{ always() && !cancelled() && !inputs.skip_tests && needs.paths.outputs.run_sonar == 'true' }}
    needs:
      - paths
      - shifter-platform-coverage
      - shifter-platform-openfga
      - shifter-platform-js-tests
      - shifter-platform-spa
      - shifter-engine-tests
      - packer-tests
      - openvpn-tests
      - guacamole-authority-tests
      - bootstrap-tests
      - check-layer-imports-tests
      - installation-tests
      - adr-guard-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Full history so SonarCloud attributes new code accurately for
          # pull-request (new-code) quality-gate analysis.
          fetch-depth: 0

      # Coverage reports are produced only by test jobs that ran for the
      # changed paths. Each download mirrors that job's path filter and
      # success result so a portal-only PR does not fail Sonar waiting for
      # skipped-job artifacts (issue #786).
      - name: Download shifter_platform coverage
        if: >-
          ${{ (needs.paths.outputs.run_all == 'true' || needs.paths.outputs.shifter_platform == 'true')
          && needs.shifter-platform-coverage.result == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-shifter-platform
          path: shifter/shifter_platform
      - name: Download OpenFGA and native SQL coverage
        if: >-
          ${{ (needs.paths.outputs.run_all == 'true' || needs.paths.outputs.shifter_platform == 'true')
          && needs.shifter-platform-openfga.result == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-shifter-platform-openfga
          path: shifter/shifter_platform
      - name: Download shifter_platform JS coverage
        if: >-
          ${{ (needs.paths.outputs.run_all == 'true' || needs.paths.outputs.shifter_platform == 'true')
          && needs.shifter-platform-js-tests.result == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-shifter-platform-js
          path: shifter/shifter_platform/coverage
      - name: Download shifter_platform SPA coverage
        if: >-
          ${{ (needs.paths.outputs.run_all == 'true' || needs.paths.outputs.shifter_platform == 'true')
          && needs.shifter-platform-spa.result == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-shifter-platform-spa
          path: shifter/shifter_platform/frontend/coverage
      - name: Download provisioner coverage
        if: >-
          ${{ (needs.paths.outputs.run_all == 'true' || needs.paths.outputs.provisioner == 'true')
          && needs.shifter-engine-tests.result == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-provisioner
          path: shifter/engine/provisioner
      - name: Download packer coverage
        if: >-
          ${{ (needs.paths.outputs.run_all == 'true' || needs.paths.outputs.packer == 'true')
          && needs.packer-tests.result == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-packer
          path: shifter/packer
      - name: Download openvpn coverage
        if: >-
          ${{ (needs.paths.outputs.run_all == 'true' || needs.paths.outputs.openvpn == 'true')
          && needs.openvpn-tests.result == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-openvpn
          path: shifter/engine/openvpn
      - name: Download bootstrap coverage
        if: >-
          ${{ (needs.paths.outputs.run_all == 'true' || needs.paths.outputs.bootstrap == 'true')
          && needs.bootstrap-tests.result == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-bootstrap
          path: scripts/bootstrap
      - name: Download check_layer_imports coverage
        if: >-
          ${{ (needs.paths.outputs.run_all == 'true' || needs.paths.outputs.check_layer_imports == 'true')
          && needs.check-layer-imports-tests.result == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-check-layer-imports
          path: scripts/check_layer_imports
      - name: Download installation coverage
        if: >-
          ${{ (needs.paths.outputs.run_all == 'true' || needs.paths.outputs.installation == 'true')
          && needs.installation-tests.result == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-installation
          path: shifter/installation
      - name: Download adr_guard coverage
        if: >-
          ${{ (needs.paths.outputs.run_all == 'true' || needs.paths.outputs.adr_guard == 'true'
          || needs.paths.outputs.guard_selfcheck == 'true')
          && needs.adr-guard-tests.result == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-adr-guard
          path: scripts/adr_guard

      - name: Setup Java for SonarScanner
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Download Guacamole authority coverage
        if: ${{ needs.guacamole-authority-tests.result == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-guacamole-authority
          path: shifter/engine/guacamole/authority-extension/target/site/jacoco

      - name: Compile Java sources for analysis
        working-directory: shifter/engine/guacamole/authority-extension
        run: mvn --batch-mode --no-transfer-progress -DskipTests compile

      - name: SonarQube Cloud scan
        # Gated on the upstream repository's immutable IDs, NOT on the variables
        # below being set (ADR-003-R7). `vars.SONAR_PROJECT_KEY != ''` would look
        # equivalent but makes a renamed or deleted variable skip the scan
        # silently, taking the SonarCloud quality gate out of PR Gate with
        # everything still green. The upstream repository therefore always
        # attempts the scan and fails loud on misconfiguration. The IDs do not
        # change on a rename, and they equal docs/adr/repository-identity.json
        # (ADR-069). A fork has other IDs and skips the scan: SonarCloud is our
        # tooling choice, not a dependency we impose on people who cloned the repo.
        #
        # Fork-origin pull requests also skip. They run in the base repository's
        # context, so the identity test above passes, but GitHub withholds
        # secrets from them — the scan would fail on a missing SONAR_TOKEN and
        # hand an outside contributor a red check they have no way to fix.
        # Analysis for their code happens on the `dev` run after merge. A
        # fork-origin PR is detected by head-repo identity — its head repo
        # differs from this one — NOT by `head.repo.fork`: this repository is
        # itself a fork of the upstream, so `head.repo.fork` is true for every
        # PR opened from its own branches and would wrongly skip the scan on
        # every canonical-repo PR (#1310). `push` events (dev branch runs) carry
        # no pull_request payload and always scan.
        if: >-
          ${{ github.repository_id == '1241599684'
          && github.repository_owner_id == '308592074'
          && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # Project key and organization are repository configuration, supplied
          # from non-secret repository variables (the analysis token stays in
          # env: and never reaches argv). Sources, exclusions, suppressions, and
          # coverage report paths remain shared analysis configuration in the
          # repo-root sonar-project.properties. Every canonical analysis waits
          # for the quality-gate verdict: a successful upload is not evidence
          # that the analyzed source passed the configured release gate (#2084).
          args: >-
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.scanner.skipJreProvisioning=true
            -Dsonar.qualitygate.wait=true
            ${{ github.event_name == 'workflow_dispatch' && format('-Dsonar.branch.name={0}', github.ref_name) || '' }}
