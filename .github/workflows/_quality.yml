  k8s-schema:
    permissions:
      contents: read
    name: Lint (k8s schemas)
    needs: [paths]
    if: ${{ (needs.paths.outputs.run_all == 'true' || needs.paths.outputs.charts == 'true') }}
    runs-on: ubuntu-latest
    # The Helm chart is the only Kubernetes renderer (ADR-007, #2571). This job
    # validates the rendered chart for every supported profile with strict
    # schema checks. kube-linter on the same renders runs in chart-lint-security.
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Helm (hermetic, version-pinned, checksum-verified)
        env:
          HELM_VERSION: v3.15.4
          HELM_SHA256: 11400fecfc07fd6f034863e4e0c4c4445594673fd2a129e701fe41f31170cfa9
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/helm-bin"
          curl -fsSL -o "${RUNNER_TEMP}/helm.tar.gz" \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  ${RUNNER_TEMP}/helm.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/helm.tar.gz" -C "${RUNNER_TEMP}" linux-amd64/helm
          mv "${RUNNER_TEMP}/linux-amd64/helm" "${RUNNER_TEMP}/helm-bin/helm"
          echo "${RUNNER_TEMP}/helm-bin" >> "${GITHUB_PATH}"

      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: v0.7.0
        run: |
          set -euo pipefail
          # ADR-037-R3: verify the download against the release CHECKSUMS
          # manifest before extraction. The archive is saved under the exact name
          # the manifest references so `sha256sum -c` matches.
          dir="${RUNNER_TEMP}/kubeconform"
          mkdir -p "${dir}"
          curl -fsSL -o "${dir}/kubeconform-linux-amd64.tar.gz" \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          curl -fsSL -o "${dir}/CHECKSUMS" \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/CHECKSUMS"
          (cd "${dir}" && grep "kubeconform-linux-amd64.tar.gz" CHECKSUMS | sha256sum -c -)
          tar -xzf "${dir}/kubeconform-linux-amd64.tar.gz" -C "${dir}" kubeconform

      - name: Render every supported profile and validate schemas
        env:
          # GKE custom resources (BackendConfig, FrontendConfig, ManagedCertificate)
          # have no upstream Kubernetes schema. Their schemas come from the CRD
          # catalog at one pinned commit, so the content can not change under
          # this job. Every other kind uses the default Kubernetes schemas.
          CRD_SCHEMA_LOCATION: https://raw.githubusercontent.com/datreeio/CRDs-catalog/3eb90d47aba8d61919d4419dd38301536e32a94b/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/rendered-chart"
          for values in values.yaml values-aws-dev.yaml values-aws-prod.yaml values-gcp-dev.yaml values-gcp-prod.yaml; do
            helm template quality-check platform/charts/shifter \
              -f "platform/charts/shifter/${values}" \
              > "${RUNNER_TEMP}/rendered-chart/${values}"
          done
          "${RUNNER_TEMP}/kubeconform/kubeconform" -strict -summary \
            -kubernetes-version 1.31.0 \
            -schema-location default \
            -schema-location "${CRD_SCHEMA_LOCATION}" \
            "${RUNNER_TEMP}/rendered-chart/"*.yaml

  # ===========================================================================
  # Type Checking (blocking quality gate, #564)
  #
  # mypy is an enforced guardrail, not advisory telemetry. Each job runs the
  # full package mypy estate (enforced scope = the package minus the
  # transitional dirs declared in its pyproject.toml `[tool.mypy].exclude`)
  # and fails the job - and thus the PR Gate - on any error. Like the
  # architecture and SAST guardrails below, these jobs do NOT honor
  # `skip_tests`. Do NOT reintroduce `continue-on-error: true` or `|| true`:
  # exempt a module via an explicit `[[tool.mypy.overrides]]` in the package
  # pyproject.toml instead, so the enforced/transitional boundary stays in
  # one place.
  #
  # ===========================================================================

  shifter-platform-typecheck:
    permissions:
      contents: read
    name: Type Check (shifter_platform)
    needs: [paths]
    if: ${{ (needs.paths.outputs.run_all == 'true' || needs.paths.outputs.shifter_platform == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install dependencies
        working-directory: shifter/shifter_platform
        run: uv sync --group dev

      - name: Run mypy
        working-directory: shifter/shifter_platform
        # The django-stubs mypy plugin imports `config.settings` to construct
        # itself, so the run needs synthetic, non-production Django env
        # or the plugin raises and mypy exits with an INTERNAL ERROR.
        env:
          DJANGO_DEBUG: "true"
          DJANGO_SECRET_KEY: dummy-for-testing
          PYTHONPATH: ".."
        run: uv run mypy .

  provisioner-typecheck:
