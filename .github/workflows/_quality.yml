      - name: Run Bandit
        run: |
          uv tool install bandit
          bandit -r shifter/shifter_platform/ --skip B101 --exclude shifter/shifter_platform/tests,shifter/shifter_platform/.venv
          bandit -r shifter/shifter_adapter_sdk/ --skip B101 --exclude shifter/shifter_adapter_sdk/tests,shifter/shifter_adapter_sdk/.venv

