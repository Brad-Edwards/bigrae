        run: |
          uv tool install 'bandit[toml]'
          bandit -r . -c pyproject.toml

  # ===========================================================================
  # Python Tests
  # ===========================================================================

  # ===========================================================================
  # shifter_platform application suite (#1524, #2582)
  #
  # Runs the broad application suite one time, against a real PostgreSQL
  # backend, so production persistence semantics (transactions, model/DB
  # constraints, select_for_update / skip_locked, and the Range subnet-index
  # LOCK TABLE ... IN EXCLUSIVE MODE branch) are exercised for real.
  # TEST_DB_BACKEND=postgres selects the stock PostgreSQL backend via
  # config._database_settings. Each xdist worker clones its test database from
  # one migrated template (root conftest django_db_setup). pytest-split divides
  # the suite into parallel shards; with no durations file, `least_duration`
  # deals the tests out in turn, so slow and fast tests spread evenly. Each
  # shard uploads its coverage data and its postgres-marker evidence;
  # shifter-platform-coverage combines them, applies the cross-shard marker
  # guard, and enforces the whole-package coverage floor.
  # It is required through the reusable-workflow -> PR Gate chain.
  # ===========================================================================
  shifter-platform-tests:
    permissions:
      contents: read
    name: Tests (shifter_platform, PostgreSQL ${{ matrix.group }}/6)
    needs: [paths, shifter-platform-lint, shifter-platform-lint-js, shifter-platform-sast]
    if: ${{ !inputs.skip_tests && ((needs.paths.outputs.run_all == 'true' || needs.paths.outputs.shifter_platform == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5, 6]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: shifter
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install dependencies
        working-directory: shifter/shifter_platform
        run: uv sync --group dev

      # Broad application scope against real PostgreSQL, excluding tests owned by
      # another real service posture (redis/OpenFGA). `--cov-fail-under=0`: one
      # shard cannot measure the whole-package floor; the coverage job enforces
      # it on the combined data. The root-conftest marker guard fails a shard on
      # any skipped postgres-marked test and writes postgres-lane-evidence.json.
      - name: Run application suite against PostgreSQL
        working-directory: shifter/shifter_platform
        env:
          TESTING: "1"
          TEST_DB_BACKEND: postgres
          DJANGO_DEBUG: "true"
          DJANGO_SECRET_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: shifter
          DB_USER: test
          DB_PASSWORD: test
          SHARD_GROUP: ${{ matrix.group }}
        run: |
          uv run python manage.py collectstatic --noinput
          uv run pytest tests/ -m "not redis and not openfga and not apiserver" \
            --splits 6 --group "$SHARD_GROUP" --splitting-algorithm least_duration \
            --cov --cov-report= --cov-fail-under=0 \
            --junit-xml=postgres-junit.xml -p no:cacheprovider

      - name: Upload shard coverage data and marker evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-data-shifter-platform-${{ matrix.group }}
          path: |
            shifter/shifter_platform/.coverage
            shifter/shifter_platform/postgres-lane-evidence.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Upload shard JUnit (failure evidence)
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: postgres-lane-junit-${{ matrix.group }}
          path: shifter/shifter_platform/postgres-junit.xml
          if-no-files-found: warn
          retention-days: 1

  shifter-platform-coverage:
    permissions:
      contents: read
    name: Coverage (shifter_platform)
    needs: [paths, shifter-platform-tests]
    if: ${{ !inputs.skip_tests && ((needs.paths.outputs.run_all == 'true' || needs.paths.outputs.shifter_platform == 'true')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install dependencies
        working-directory: shifter/shifter_platform
        run: uv sync --group dev

      - name: Download shard coverage data and marker evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-data-shifter-platform-*
          path: shifter/shifter_platform/shards

      # The "at least one postgres-marked test ran" rule (#1524) spans shards.
      - name: Check PostgreSQL lane marker evidence across shards
        working-directory: shifter/shifter_platform
        run: uv run python scripts/check_postgres_lane_evidence.py shards/*/postgres-lane-evidence.json

      # `coverage report` honours pyproject `[tool.coverage.report] fail_under`
      # (#1529 / REV1 Q6): the whole-package non-regression floor.
      - name: Combine coverage and enforce the floor
        working-directory: shifter/shifter_platform
        run: |
          uv run coverage combine shards/*/.coverage
          uv run coverage report --show-missing
          uv run coverage xml -o coverage.xml

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-shifter-platform
          path: shifter/shifter_platform/coverage.xml
          if-no-files-found: error
          retention-days: 1

  # Real-stack Redis channel-layer evidence (#924). Runs only the redis-marked
  # integration tests against the Redis service, with xdist disabled (-n0) for
  # deterministic stateful isolation. Redis is a channel-layer service, not a
  # database backend, so these tests run on SQLite (#1524).
  shifter-platform-redis:
    permissions:
      contents: read
    name: Tests (shifter_platform, Redis channel layer)
    needs: [paths, shifter-platform-lint, shifter-platform-sast]
    if: ${{ !inputs.skip_tests && ((needs.paths.outputs.run_all == 'true' || needs.paths.outputs.shifter_platform == 'true')) }}
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4.9
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install dependencies
        working-directory: shifter/shifter_platform
        run: uv sync --group dev

      - name: Run Redis channel-layer integration tests
        working-directory: shifter/shifter_platform
        env:
          TESTING: "1"
          TEST_DB_BACKEND: sqlite
          DJANGO_DEBUG: "true"
          DJANGO_SECRET_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
          CHANNEL_LAYER_BACKEND: redis
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
        run: |
          uv run pytest tests/integration/asgi -m redis -n0 -p no:cacheprovider

  adapter-sdk-tests:
    permissions:
      contents: read
    name: Tests (adapter SDK)
    needs: [paths, shifter-platform-lint, shifter-platform-sast]
    if: ${{ !inputs.skip_tests && ((needs.paths.outputs.run_all == 'true' || needs.paths.outputs.shifter_platform == 'true')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Test and build independent adapter SDK
        working-directory: shifter/shifter_adapter_sdk
        run: |
          uv sync --frozen --all-extras
          uv run --all-extras pytest tests/
          uv build
          (cd dist && sha256sum ./*.whl ./*.tar.gz > SHA256SUMS)

      - name: Preserve SDK candidate distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: adapter-sdk-candidate-${{ github.sha }}
          path: shifter/shifter_adapter_sdk/dist/*
          if-no-files-found: error
          retention-days: 14

  shifter-platform-openfga:
    permissions:
      contents: read
    name: Tests (OpenFGA 1.20.0, PostgreSQL)
    needs: [paths, shifter-platform-lint, shifter-platform-sast]
    if: ${{ !inputs.skip_tests && ((needs.paths.outputs.run_all == 'true' || needs.paths.outputs.shifter_platform == 'true')) }}
