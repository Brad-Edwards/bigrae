    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install dependencies
        working-directory: shifter/shifter_platform
        run: uv sync --group dev

      - name: Run released OpenFGA conformance
        working-directory: shifter/shifter_platform
        # Supplemental real-service evidence for Sonar's changed-code gate.
        # The shifter-platform-coverage job enforces the whole-package 87%
        # non-regression floor; this service-only selection cannot measure it.
        run: ./scripts/run_openfga_integration.sh --cov --cov-report=xml:coverage-openfga.xml --cov-fail-under=0

      - name: Upload OpenFGA and native SQL coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-shifter-platform-openfga
          path: shifter/shifter_platform/coverage-openfga.xml
          if-no-files-found: error
          retention-days: 1

