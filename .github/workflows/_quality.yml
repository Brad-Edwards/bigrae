name: Quality

on:
  workflow_call:
    inputs:
      skip_tests:
        description: 'Skip test jobs (linting still runs)'
        required: false
        type: boolean
        default: false
      run_full_matrix:
        description: >-
          Run every quality job regardless of path filters. Set by the caller
          for workflow_dispatch full-validation runs.
        required: false
        type: boolean
        default: false
      run_stack_smoke:
        description: >-
          Run the built-image stack-smoke job. Driven by the caller from the
          portal_image / shifter_platform path filters so it only builds and
          boots the portal image when the image's inputs change.
        required: false
        type: boolean
        default: false
    secrets:
      SONAR_TOKEN:
        description: 'SonarCloud analysis token (sonarcloud job)'
        required: true

jobs:
  # ===========================================================================
  # Path detection (issue #774)
  #
  # Categories live in .github/quality-path-filters.yaml. Workflow-file
  # changes force the full matrix so a broken pipeline cannot slip through.
  # ===========================================================================

  paths:
    permissions:
      contents: read
    name: Detect quality paths
    runs-on: ubuntu-latest
    outputs:
      # run_all folds in the independent guard_selfcheck sentinel (a
      # workflow-owned expression the PR's classifier cannot influence): any
      # change to the ownership contract / classifier / guard forces the FULL
      # matrix, so a tampered classifier cannot emit run_all=false to skip the
      # production lint / SAST / test jobs that would inspect its own payload
      # (#1530, ADR-004-R24 self-bypass prevention).
      run_all: ${{ steps.detect.outputs.run_all == 'true' || steps.selfcheck.outputs.guard_selfcheck == 'true' }}
      run_sonar: ${{ steps.detect.outputs.run_sonar }}
      ci_workflows: ${{ steps.detect.outputs.ci_workflows }}
      shifter_platform: ${{ steps.detect.outputs.shifter_platform }}
      provisioner: ${{ steps.detect.outputs.provisioner }}
      packer: ${{ steps.detect.outputs.packer }}
      openvpn: ${{ steps.detect.outputs.openvpn }}
      bootstrap: ${{ steps.detect.outputs.bootstrap }}
      gcp_scripts: ${{ steps.detect.outputs.gcp_scripts }}
      check_layer_imports: ${{ steps.detect.outputs.check_layer_imports }}
      check_rds_pending_modifications: ${{ steps.detect.outputs.check_rds_pending_modifications }}
      handle_sd_replacement: ${{ steps.detect.outputs.handle_sd_replacement }}
      assert_portal_inspection: ${{ steps.detect.outputs.assert_portal_inspection }}
      installation: ${{ steps.detect.outputs.installation }}
      event_load_harness: ${{ steps.detect.outputs.event_load_harness }}
      range_functional_smoke: ${{ steps.detect.outputs.range_functional_smoke }}
      terraform: ${{ steps.detect.outputs.terraform }}
      mcp_ngfw: ${{ steps.detect.outputs.mcp_ngfw }}
      mcp_ops: ${{ steps.detect.outputs.mcp_ops }}
      mcp_planner: ${{ steps.detect.outputs.mcp_planner }}
      mcp_shared: ${{ steps.detect.outputs.mcp_shared }}
      adr_guard: ${{ steps.detect.outputs.adr_guard }}
      # Independent of the classifier (steps.selfcheck, not steps.detect): forces
      # the guard's own verification to run on any contract/classifier/guard-file
      # change so it cannot self-bypass (#1530, ADR-004-R24).
      guard_selfcheck: ${{ steps.selfcheck.outputs.guard_selfcheck }}
      stack_smoke: ${{ steps.detect.outputs.stack_smoke }}
      # Build and deployment inputs use the same contract-driven routing.
      container_images: ${{ steps.detect.outputs.container_images }}
      gcp_deployer: ${{ steps.detect.outputs.gcp_deployer }}
      portal_image_context: ${{ steps.detect.outputs.portal_image_context }}
      guacamole_authority: ${{ steps.detect.outputs.guacamole_authority }}
      charts: ${{ steps.detect.outputs.charts }}
      provisioner_admission: ${{ steps.detect.outputs.provisioner_admission }}
      mcp_lint_any: ${{ steps.detect.outputs.mcp_lint_any }}
      mcp_test_any: ${{ steps.detect.outputs.mcp_test_any }}
      mcp_lint_packages: ${{ steps.detect.outputs.mcp_lint_packages }}
      mcp_test_packages: ${{ steps.detect.outputs.mcp_test_packages }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Classify changed paths
        id: detect
        env:
          RUN_FULL_MATRIX: ${{ inputs.run_full_matrix }}
          DIFF_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          DIFF_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Fail-closed changed-path classification (#1530). The helper
          # validates the .github/quality-path-filters.yaml quality-ownership
          # contract and REJECTS an unclassified changed path before emitting
          # any job-selection output, so an unowned path can no longer slip
          # through with an empty matrix. It also runs documentation coverage
          # and handbook drift against the complete diff, including deletions,
          # before job routing so source-only changes cannot skip enforcement.
          # It emits the same GITHUB_OUTPUT keys
          # the downstream jobs consume. Ownership completeness and routing
          # reachability of this contract are enforced by the
          # `quality-path-ownership` adr_guard check.
          uv run --python 3.11 --with 'pyyaml==6.0.2' \
            python3 scripts/quality_ownership/classify_paths.py

      - name: Detect quality-guard changes (independent of the classifier)
        id: selfcheck
        env:
          DIFF_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          DIFF_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Self-bypass prevention (#1530, ADR-004-R24). This detection is
          # deliberately NOT sourced from scripts/quality_ownership/classify_paths.py:
          # it is a plain git diff in the workflow itself, so a PR that modifies
          # the classifier, the contract module, or the contract file to emit
          # adr_guard=false / run_all=false cannot suppress the very jobs that
          # verify those files. adr-conformance and adr-guard-tests OR this
          # output into their gate.
          base="${DIFF_BASE_SHA}"
          head="${DIFF_HEAD_SHA:-$GITHUB_SHA}"
          if [ -n "${base}" ] && [ "${base}" != "0000000000000000000000000000000000000000" ]; then
            changed="$(git diff --name-only "${base}...${head}")"
          else
            changed="$(git diff --name-only HEAD~1 HEAD)"
          fi
          selfcheck=false
          while IFS= read -r file; do
            case "${file}" in
              .github/quality-path-filters.yaml | scripts/quality_ownership/* | scripts/adr_guard/*)
                selfcheck=true
                ;;
            esac
          done <<< "${changed}"
          echo "guard_selfcheck=${selfcheck}" >> "${GITHUB_OUTPUT}"

  # ===========================================================================
  # Linting
  # ===========================================================================

  adr-conformance:
    permissions:
      contents: read
    name: Architecture (adr conformance)
    needs: [paths]
    # guard_selfcheck is an independent (non-classifier) trigger so a contract or
    # classifier edit cannot suppress its own conformance run (#1530).
    if: ${{ (needs.paths.outputs.run_all == 'true' || needs.paths.outputs.adr_guard == 'true' || needs.paths.outputs.guard_selfcheck == 'true') }}
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 fetches base-branch history so git-reference guards
      # (boundary-mock-policy, published-contract-snapshots-immutable) can
      # resolve the merge base and enforce rather than fail open on a shallow clone.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      # The self-hosted runner ships with Python 3.9, but `adr_guard.py`
      # imports the stdlib `tomllib` module added in 3.11. `uv` brings its
      # own Python and is already the Python toolchain every other job in
      # this workflow uses, so it's the portable fix: no OS-package upgrade
      # on the runner VMs, no dependency on `actions/setup-python`'s
      # version manifest (which doesn't cover the runner distro).
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install Helm for ADR guard chart rendering (hermetic, version-pinned, checksum-verified)
        env:
          HELM_VERSION: v3.15.4
          # Reviewed, digest-pinned SHA-256 of helm-v3.15.4-linux-amd64.tar.gz.
          # Pinned in reviewed repo content rather than fetched from get.helm.sh
          # (the same mutable origin as the binary), so a compromised release
          # bucket/CDN/publishing credential cannot supply a matching checksum
          # for a tampered tarball. Bump both fields together on a Helm upgrade.
          HELM_SHA256: 11400fecfc07fd6f034863e4e0c4c4445594673fd2a129e701fe41f31170cfa9
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/helm-bin"
          curl -fsSL -o "${RUNNER_TEMP}/helm.tar.gz" \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  ${RUNNER_TEMP}/helm.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/helm.tar.gz" -C "${RUNNER_TEMP}" linux-amd64/helm
          mv "${RUNNER_TEMP}/linux-amd64/helm" "${RUNNER_TEMP}/helm-bin/helm"
          echo "${RUNNER_TEMP}/helm-bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/helm-bin/helm" version --short

      - name: Run ADR guard
        env:
          # Fail closed on the git-reference immutability guard now that base history is fetched.
          ADR_GUARD_SNAPSHOT_ENFORCE: "1"
        run: |
          uv run --python 3.11 --with 'pyyaml==6.0.2' \
            python scripts/adr_guard/adr_guard.py --all --level ci

  workflow-lint:
    permissions:
      contents: read
    name: Lint (GitHub Actions)
    needs: [paths]
    if: ${{ (needs.paths.outputs.run_all == 'true' || needs.paths.outputs.ci_workflows == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: devops-actions/actionlint@467e2ce19b2310e93c9ffa0b50fe31f86b5a7f23 # v0.1.10

  adr-guard-lint-security:
    permissions:
      contents: read
    name: Lint and security (ADR tooling)
    needs: [paths]
    if: ${{ needs.paths.outputs.run_all == 'true' || needs.paths.outputs.adr_guard == 'true' || needs.paths.outputs.guard_selfcheck == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Lint ADR tooling
        run: |
          uvx --from ruff==0.15.13 ruff check \
            --config scripts/adr_guard/ruff.toml \
            scripts/adr_guard scripts/quality_ownership
      - name: Scan ADR tooling
        run: |
          uvx --from bandit==1.9.4 bandit -q -ll -r \
            scripts/adr_guard scripts/quality_ownership \
            -x scripts/adr_guard/tests

  stack-smoke-lint-security:
    permissions:
      contents: read
    name: Lint and security (stack smoke)
    needs: [paths]
    if: ${{ needs.paths.outputs.run_all == 'true' || needs.paths.outputs.stack_smoke == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - uses: ./.github/actions/install-shellcheck
      - name: Lint Python helpers
        run: uvx --from ruff==0.15.13 ruff check scripts/stack-smoke
      - name: Scan Python helpers
        run: uvx --from bandit==1.9.4 bandit -q -ll -r scripts/stack-smoke
      - name: Lint shell harness
        run: shellcheck scripts/stack-smoke/*.sh

      - name: Test smoke transport restrictions
        run: python3 -m unittest discover -s scripts/stack-smoke -p 'test_*.py'

  deployment-utilities-sast:
    permissions:
      contents: read
    name: Security (deployment utilities)
    needs: [paths]
    if: >-
      ${{ needs.paths.outputs.run_all == 'true'
      || needs.paths.outputs.check_rds_pending_modifications == 'true'
      || needs.paths.outputs.handle_sd_replacement == 'true'
      || needs.paths.outputs.assert_portal_inspection == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Scan deployment utilities
        run: |
          uvx --from bandit==1.9.4 bandit -q -ll -r \
            scripts/check_rds_pending_modifications \
            scripts/handle_sd_replacement \
            scripts/assert_portal_inspection \
            -x scripts/check_rds_pending_modifications/tests,scripts/handle_sd_replacement/tests,scripts/assert_portal_inspection/tests

  container-images-lint-security:
    permissions:
      contents: read
    name: Lint and security (container inputs)
    needs: [paths]
    if: ${{ needs.paths.outputs.run_all == 'true' || needs.paths.outputs.container_images == 'true' || needs.paths.outputs.gcp_deployer == 'true' || needs.paths.outputs.portal_image_context == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: ./.github/actions/install-shellcheck
      - name: Check Dockerfiles with BuildKit
        run: |
          docker build --check shifter/engine/guacamole
          docker build --check shifter/engine/guacd
          docker build --check -f shifter/shifter_platform/Dockerfile shifter
          docker build --check -f platform/deployer/gcp/Dockerfile .
      - name: Lint container entrypoints
        run: shellcheck shifter/engine/guacamole/*.sh
      - name: Install Trivy
        env:
          TRIVY_VERSION: 0.76.1
          TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/trivy-bin"
          curl -fsSL -o "${RUNNER_TEMP}/trivy.tar.gz" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  ${RUNNER_TEMP}/trivy.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/trivy.tar.gz" -C "${RUNNER_TEMP}/trivy-bin" trivy
          echo "${RUNNER_TEMP}/trivy-bin" >> "${GITHUB_PATH}"
      # Every severity blocks (#1698).
      - name: Scan Dockerfile policy
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        run: |
          trivy config --skip-version-check --exit-code 1 shifter/engine/guacamole
          trivy config --skip-version-check --exit-code 1 shifter/engine/guacd
          trivy config --skip-version-check --exit-code 1 shifter/shifter_platform/Dockerfile
          trivy config --skip-version-check --exit-code 1 platform/deployer/gcp/Dockerfile

  # The deployer image builds from the repository with a fixture release
  # manifest, passes its in-image build checks (manifest revision, provider
  # mirror, command load), and starts (#2571, ADR-070).
  gcp-deployer-image:
    permissions:
      contents: read
    name: Tests (GCP deployer image)
    needs: [paths]
    if: ${{ !inputs.skip_tests && (needs.paths.outputs.run_all == 'true' || needs.paths.outputs.gcp_deployer == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Write a fixture release manifest
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/release"
          chart_version="$(awk '/^version:/ {print $2; exit}' platform/charts/shifter/Chart.yaml)"
          fixture="example.invalid/release"
          digest="sha256:$(printf '0%.0s' $(seq 1 64))"
          uv run --project shifter/installation --frozen shifter-config gcp-release-manifest \
            --version "ci-${GITHUB_RUN_ID}" --source-revision "${GITHUB_SHA}" --chart-version "${chart_version}" \
            --image "portal=${fixture}/portal@${digest}" \
            --image "provisioner=${fixture}/provisioner@${digest}" \
            --image "guacd=${fixture}/guacd@${digest}" \
            --image "guacamole-client=${fixture}/guacamole-client@${digest}" \
            --image "openvpn=${fixture}/openvpn@${digest}" \
            > "${RUNNER_TEMP}/release/release.json"
      - name: Build the deployer image
        run: |
          docker buildx build -f platform/deployer/gcp/Dockerfile \
            --build-context "release=${RUNNER_TEMP}/release" \
            --build-arg "SOURCE_REVISION=${GITHUB_SHA}" \
            --load -t bigrae-deployer:ci .
      - name: Start the deployer image
        run: docker run --rm bigrae-deployer:ci gcp-deploy --help
      - name: Install pinned Trivy
        env:
          TRIVY_VERSION: 0.76.1
          TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/trivy-bin"
          curl -fsSL -o "${RUNNER_TEMP}/trivy.tar.gz" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  ${RUNNER_TEMP}/trivy.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/trivy.tar.gz" -C "${RUNNER_TEMP}/trivy-bin" trivy
      # A HIGH or CRITICAL finding with a fix blocks. The only accepted
      # exposures are the time-boxed vendor-binary entries in
      # platform/deployer/gcp/trivyignore.yaml.
      - name: Scan the deployer image
        run: |
          "${RUNNER_TEMP}/trivy-bin/trivy" image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --ignorefile platform/deployer/gcp/trivyignore.yaml \
            --db-repository mirror.gcr.io/aquasec/trivy-db \
            --java-db-repository mirror.gcr.io/aquasec/trivy-java-db \
            --exit-code 1 "bigrae-deployer:ci"

  chart-lint-security:
    permissions:
      contents: read
    name: Lint and security (Helm chart)
    needs: [paths]
    if: ${{ needs.paths.outputs.run_all == 'true' || needs.paths.outputs.charts == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install Helm
        env:
          HELM_VERSION: v3.15.4
          HELM_SHA256: 11400fecfc07fd6f034863e4e0c4c4445594673fd2a129e701fe41f31170cfa9
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/helm-bin"
          curl -fsSL -o "${RUNNER_TEMP}/helm.tar.gz" \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  ${RUNNER_TEMP}/helm.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/helm.tar.gz" -C "${RUNNER_TEMP}" linux-amd64/helm
          mv "${RUNNER_TEMP}/linux-amd64/helm" "${RUNNER_TEMP}/helm-bin/helm"
          echo "${RUNNER_TEMP}/helm-bin" >> "${GITHUB_PATH}"
      - name: Install kube-linter
        env:
          KUBE_LINTER_SHA256: 8a0f8ba6c28910acd4886cc4d501ed32f3d404a53ac5e72c45a0dd893fcadb03
        run: |
          set -euo pipefail
          curl -fsSL -o "${RUNNER_TEMP}/kube-linter.tar.gz" \
            "https://github.com/stackrox/kube-linter/releases/download/v0.7.2/kube-linter-linux.tar.gz"
          echo "${KUBE_LINTER_SHA256}  ${RUNNER_TEMP}/kube-linter.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/kube-linter.tar.gz" -C "${RUNNER_TEMP}" kube-linter
      - name: Lint and render every supported profile
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/rendered-chart"
          for values in values.yaml values-aws-dev.yaml values-aws-prod.yaml values-gcp-dev.yaml values-gcp-prod.yaml; do
            helm lint platform/charts/shifter -f "platform/charts/shifter/${values}"
            helm template quality-check platform/charts/shifter \
              -f "platform/charts/shifter/${values}" \
              > "${RUNNER_TEMP}/rendered-chart/${values}"
          done
          "${RUNNER_TEMP}/kube-linter" lint --config .kube-linter.yaml "${RUNNER_TEMP}/rendered-chart"

  terraform-lint:
    permissions:
      contents: read
    name: Lint (terraform)
    needs: [paths]
    if: ${{ (needs.paths.outputs.run_all == 'true' || needs.paths.outputs.terraform == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@6e87008f9dd1fe3e34e66aca6c97b4a69f72a7f4 # v4

      - name: Init TFLint
        env:
          # TFLint resolves provider plugins through the GitHub Releases API.
          # Authenticate those requests so shared hosted-runner IPs do not hit
          # the unauthenticated 60-request/hour limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: tflint --init --config "${GITHUB_WORKSPACE}/.tflint.hcl"

      - name: Run TFLint
        working-directory: platform/terraform
        run: tflint --recursive --config "${GITHUB_WORKSPACE}/.tflint.hcl"

      # ADR-020-R1: each range security group may admit only its own subnet,
      # explicit connected peers, and the audited management/VPN sources. This
      # is intentionally a blocking CI guard rather than a local pre-commit
      # hook, and scans every tracked Terraform file in the provisioner range
      # module so a newly added file cannot bypass the isolation invariant.
      - name: Run check-tf-sg-cidrs
        run: |
          mapfile -t range_tf_files < <(
            find shifter/engine/provisioner/terraform/modules/range \
              -type f -name '*.tf' -print | sort
          )
          python3 scripts/check_tf_sg_cidrs/check_tf_sg_cidrs.py \
            "${range_tf_files[@]}"

      # ADR-004-R10 / issue #52: the kms:Decrypt grant for the portal
      # Secrets Manager CMK on roles that read Secrets Manager. Wired
      # alongside terraform-lint because the inputs are .tf files and
      # this is the natural "terraform architecture" gate; runs in the
      # same job to avoid an extra runner pool slot. CI enforces the invariant
      # for every module that defines an IAM role
      # whose attached policies grant secretsmanager:GetSecretValue on a
      # portal-CMK secret.
      - name: Run check-tf-kms-secrets-grant
        run: |
          python3 scripts/check_tf_kms_secrets_grant/check_tf_kms_secrets_grant.py \
            platform/terraform/modules/provisioner-iam/*.tf

      # Issues #46/#1755: action/resource-aware ELBv2 scoping for GWLB and
      # request-owned VPN NLB resources, including creation-time listener tags.
      # CI enforces the same policy/runtime inputs authoritatively.
      - name: Run check-tf-iam-elb-scope
        run: |
          python3 scripts/check_tf_iam_elb_scope/check_tf_iam_elb_scope.py \
            platform/terraform/modules/provisioner-iam/main.tf \
            platform/terraform/modules/portal/eks/load_balancer_controller_iam.tf \
            shifter/engine/provisioner/terraform/modules/range/vpn.tf

      # Issue #1179: SSM Run Command IAM scoping on the engine provisioner
      # ECS task role. Mirrors check-tf-iam-ec2-scope: rejects account-wide
      # ssm:SendCommand / ec2:RebootInstances and requires the range-instance
      # tag conditions so a provisioner compromise cannot command portal or
      # runner instances. CI enforces it authoritatively.
      - name: Run check-tf-iam-ssm-scope
        run: |
          python3 scripts/check_tf_iam_ssm_scope/check_tf_iam_ssm_scope.py \
            platform/terraform/modules/provisioner-iam/main.tf

      # Issue #1846: this checker previously lacked a live CI invocation, so a
      # commit that bypassed local hooks could land an EC2 lifecycle IAM
      # regression.
      - name: Run check-tf-iam-ec2-scope
        run: |
          python3 scripts/check_tf_iam_ec2_scope/check_tf_iam_ec2_scope.py \
            platform/terraform/modules/provisioner-iam/main.tf

      - name: Run check-tf-iam-role-naming
        run: |
          python3 scripts/check_tf_iam_role_naming/check_tf_iam_role_naming.py

      # ADR-004-R20 / issue #1222: the self-hosted deploy runner must not be
      # placed in the account default VPC (a range's private-DNS VPC endpoints
      # can hijack its AWS API resolution). CI is the authoritative execution
      # boundary for the fail-closed default-VPC precondition.
      - name: Run check-tf-runner-network
        run: |
          python3 scripts/check_tf_runner_network/check_tf_runner_network.py

      # ADR-008 / issue #1546: the GCP-native self-hosted runner must live in a
      # dedicated custom-mode VPC (never the project default network) and admit
      # SSH only from Google's IAP range. CI is the authoritative execution
      # boundary for the runner network-isolation guard.
      - name: Run check-tf-gcp-runner-network
        run: |
          python3 scripts/check_tf_gcp_runner_network/check_tf_gcp_runner_network.py

      # ADR-004-R23 / issues #1690 and #1699: GCP GitHub-Actions WIF trust pins
      # exact protected assertion.ref + literal assertion.sub allow-list (no
      # repository-only condition, no repository-wide principalSet, no CKV_GCP_125
      # waiver), with purpose subjects and permissions disjoint and least privilege.
      # CI is the authoritative execution boundary for the exact-subject WIF guard.
      - name: Run check-tf-gcp-wif-trust
        run: |
          python3 scripts/check_tf_gcp_wif_trust/check_tf_gcp_wif_trust.py

      # Issue #1178: the shared range guest instance role must not grant SSM
      # Parameter Store access on a Resource that wildcards the environment or
      # range segment (parameter/shifter/*/range/*). CI is the authoritative
      # execution boundary for the cross-range isolation guard.
      - name: Run check-tf-iam-ssm-range-scope
        run: |
          python3 scripts/check_tf_iam_ssm_range_scope/check_tf_iam_ssm_range_scope.py \
            platform/terraform/modules/range/vpc/iam.tf

      # ADR-004-R12 / issue #140: first-party RDS instances must keep
      # IAM DB auth enabled and explicitly pin a CA identifier. Checkov
      # enforces IAM auth, but CKV_AWS_211 currently passes when the CA
      # attribute is absent, so this repo-native guard closes that gap.
      - name: Run check-tf-rds-security
        run: |
          python3 scripts/check_tf_rds_security/check_tf_rds_security.py \
            platform/terraform/modules/portal/rds/main.tf

      # ADR-008-R7 / issue #1517: GCP application workload identities must not
      # receive project-level Secret Manager payload/admin or Cloud Storage
      # object-admin roles; static access is bound per named secret / bucket, and
      # only the two dynamic-secret residuals tracked in #1586 are allowlisted.
      # CI is the authoritative execution boundary for the resource-scope guard.
      - name: Run check-tf-gcp-iam-resource-scope
        run: |
          python3 scripts/check_tf_gcp_iam_resource_scope/check_tf_gcp_iam_resource_scope.py \
            platform/terraform/gcp/modules/portal/iam/*.tf

      # Issue #504 / #2535: platform-core/main.tf stays a composition facade
      # (module blocks, VPC peering, and the cross-module topology invariant);
      # resources belong in submodules.
      - name: Run check-gcp-tf-modules
        run: python3 scripts/check_gcp_tf_modules/check_gcp_tf_modules.py

      # ADR-004-R11: require blocking CI Checkov with canonical inputs.
      # A local hook is optional; if present, it must match this policy.
      - name: Run check-checkov-invocation-parity
        run: python3 scripts/check_checkov_invocation_parity/check_checkov_invocation_parity.py

      # #911 NET-2 / #933: the portal target-service SGs (Django:8000,
      # Guacamole client:8080) must source ingress only from a security-group
      # reference or the ALB-only alb_ingress_subnet_cidrs output, never the
      # whole public tier (where CTFd lives). Guards the env-root SG rules so a
      # future edit cannot re-widen the source back to public_subnet_cidrs.
      - name: Run check-portal-target-sg-sources
        run: |
          python3 scripts/check_portal_target_sg_sources/check_portal_target_sg_sources.py \
            platform/terraform/environments/dev/portal/main.tf \
            platform/terraform/environments/prod/portal/main.tf

      # Pin the behavior of the check_tf_* IAM/security checkers
      # themselves. The live-file invocations above only exercise the
      # happy-path shape; the test suites cover wildcards, list
      # resources, scoped conditions, missing grants, etc. Run them so
      # a parser regression can't slip through merely because the
      # current production .tf files happen to remain in the
      # happy-path shape. Invoked as fully-qualified modules from the
      # repo root because each test uses `from .check_tf_X import …`
      # (relative imports require the package path, which
      # `unittest discover` doesn't preserve).
      - name: Run check_tf_* checker tests
        run: |
          python3 -m unittest scripts.check_tf_iam_ec2_scope.test_check_tf_iam_ec2_scope
          python3 -m unittest scripts.check_tf_iam_elb_scope.test_check_tf_iam_elb_scope
          python3 -m unittest scripts.check_tf_iam_ssm_scope.test_check_tf_iam_ssm_scope
          python3 -m unittest scripts.check_tf_iam_role_naming.test_check_tf_iam_role_naming
          python3 -m unittest scripts.check_tf_iam_ssm_range_scope.test_check_tf_iam_ssm_range_scope
          python3 -m unittest scripts.check_tf_sg_cidrs.test_check_tf_sg_cidrs
          python3 -m unittest scripts.check_tf_kms_secrets_grant.test_check_tf_kms_secrets_grant
          python3 -m unittest scripts.check_tf_rds_security.test_check_tf_rds_security
          python3 -m unittest scripts.check_portal_target_sg_sources.test_check_portal_target_sg_sources
          python3 -m unittest scripts.check_tf_runner_network.test_check_tf_runner_network
          python3 -m unittest scripts.check_tf_gcp_runner_network.test_check_tf_gcp_runner_network
          python3 -m unittest scripts.check_tf_gcp_iam_resource_scope.test_check_tf_gcp_iam_resource_scope
          python3 -m unittest scripts.check_tf_gcp_wif_trust.test_check_tf_gcp_wif_trust
          python3 -m unittest scripts.check_gcp_tf_modules.test_check_gcp_tf_modules

  # ===========================================================================
  # Terraform root validation (issue #1528)
  #
  # PR quality never ran a backendless `terraform init` + `terraform validate`,
  # so a composition error (a renamed module output, an unparseable provider
  # argument) could merge before any workflow parsed the affected root.
  # scripts/check_tf_roots/ owns platform/terraform/validation-inventory.yaml
  # and emits the CI matrix; the per-root job below runs locked, credential-free
  # init/validate on GitHub-hosted runners. This is a distinct layer from
  # TFLint / Checkov / the check_tf_* security scanners above.
  # ===========================================================================
  terraform-matrix:
    permissions:
      contents: read
    name: Terraform validation inventory + matrix
    needs: [paths]
    if: ${{ (needs.paths.outputs.run_all == 'true' || needs.paths.outputs.terraform == 'true') }}
    runs-on: ubuntu-latest
    outputs:
      roots: ${{ steps.gen.outputs.roots }}
      contract_tests: ${{ steps.gen.outputs.contract_tests }}
      has_contract_tests: ${{ steps.gen.outputs.has_contract_tests }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      # Fail closed on an invalid inventory (unclassified root/module, provider
      # drift, missing lockfile) and pin the checker's own behavior before any
      # matrix is emitted.
      - name: Validate inventory and run checker tests
        run: |
          set -euo pipefail
          uv run --python 3.11 --with 'pyyaml==6.0.2' \
            python3 scripts/check_tf_roots/check_tf_roots.py --check
          uv run --python 3.11 --with 'pyyaml==6.0.2' \
            python3 -m unittest scripts.check_tf_roots.test_check_tf_roots

      - name: Generate validation matrices
        id: gen
        run: |
          set -euo pipefail
          roots="$(uv run --python 3.11 --with 'pyyaml==6.0.2' \
            python3 scripts/check_tf_roots/check_tf_roots.py --matrix)"
          contract_tests="$(uv run --python 3.11 --with 'pyyaml==6.0.2' \
            python3 scripts/check_tf_roots/check_tf_roots.py --contract-tests)"
          {
            echo "roots=${roots}"
            echo "contract_tests=${contract_tests}"
          } >> "$GITHUB_OUTPUT"
          if [ "${contract_tests}" = "[]" ]; then
            echo "has_contract_tests=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_contract_tests=true" >> "$GITHUB_OUTPUT"
          fi

  terraform-validate:
    permissions:
      contents: read
    name: Validate (terraform ${{ matrix.root.id }})
    needs: [terraform-matrix]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root: ${{ fromJSON(needs.terraform-matrix.outputs.roots) }}
    env:
      TF_IN_AUTOMATION: '1'
      # No cloud credentials are provided; disabling EC2 metadata discovery
      # keeps a stray provider call from hanging on the runner metadata IP.
      AWS_EC2_METADATA_DISABLED: 'true'
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.tf-plugin-cache
      # Pass the (inventory-validated, path-contained) matrix path as
      # environment data rather than interpolating it into a shell script.
      ROOT_PATH: ${{ matrix.root.path }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Prepare provider cache directory
        run: mkdir -p "${TF_PLUGIN_CACHE_DIR}"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: terraform-providers-${{ runner.os }}-${{ runner.arch }}-${{ matrix.root.terraform_version }}-${{ hashFiles(format('{0}/.terraform.lock.hcl', matrix.root.path)) }}
          restore-keys: |
            terraform-providers-${{ runner.os }}-${{ runner.arch }}-${{ matrix.root.terraform_version }}-

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ matrix.root.terraform_version }}
          terraform_wrapper: false

      # Locked, backendless, noninteractive: verifies module/provider
      # resolution and checksums without a backend or cloud credentials.
      # -lockfile=readonly makes dependency drift fail instead of rewriting
      # the reviewed lockfile.
      - name: terraform init (backendless, locked)
        run: >-
          terraform -chdir="${ROOT_PATH}" init
          -backend=false -input=false -lockfile=readonly -no-color

      - name: terraform validate
        run: terraform -chdir="${ROOT_PATH}" validate -no-color

  # Credential-free `terraform test` suites (issue #1528 AC3, rollout tracked
  # in #1597; root tests added by #1437). The matrix carries every module whose
  # inventory `contract` ships a test and every root that declares a `test`;
  # when none do, the job is skipped.
  terraform-contract-tests:
    permissions:
      contents: read
    name: Contract test (${{ matrix.suite.path }})
    needs: [terraform-matrix]
    if: ${{ needs.terraform-matrix.outputs.has_contract_tests == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.terraform-matrix.outputs.contract_tests) }}
    env:
      TF_IN_AUTOMATION: '1'
      AWS_EC2_METADATA_DISABLED: 'true'
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.tf-plugin-cache
      # Pass the (inventory-validated, path-contained) matrix values as
      # environment data rather than interpolating them into a shell script.
      SUITE_PATH: ${{ matrix.suite.path }}
      SUITE_KIND: ${{ matrix.suite.kind }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Prepare provider cache directory
        run: mkdir -p "${TF_PLUGIN_CACHE_DIR}"

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ matrix.suite.terraform_version }}
          terraform_wrapper: false

      # Reusable modules carry no lockfile, so init resolves providers fresh.
      # Roots own a committed lockfile, which init must honor read-only so the
      # test runs the exact pinned providers. The suites use mock providers, so
      # they need no cloud credentials.
      - name: terraform init (backendless)
        run: |
          set -euo pipefail
          lockfile_args=()
          if [ "${SUITE_KIND}" = "root" ]; then
            lockfile_args=(-lockfile=readonly)
          fi
          terraform -chdir="${SUITE_PATH}" init \
            -backend=false -input=false -no-color "${lockfile_args[@]}"

      - name: terraform test
        run: terraform -chdir="${SUITE_PATH}" test -no-color

  shifter-platform-lint:
    permissions:
      contents: read
    name: Lint (shifter_platform)
    needs: [paths]
    if: ${{ (needs.paths.outputs.run_all == 'true' || needs.paths.outputs.shifter_platform == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install dependencies
        working-directory: shifter/shifter_platform
        run: uv sync --group dev

      - name: Lint Python
        working-directory: shifter/shifter_platform
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Lint adapter SDK
        working-directory: shifter/shifter_adapter_sdk
        run: |
          uv sync --frozen
          uv run ruff check .
          uv run ruff format --check .

      - name: Check for missing migrations
        working-directory: shifter/shifter_platform
        env:
          TESTING: "1"
          TEST_DB_BACKEND: sqlite
          DJANGO_DEBUG: "true"
          DJANGO_SECRET_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
        run: uv run python manage.py makemigrations --check --dry-run

  shifter-platform-lint-js:
    permissions:
      contents: read
    name: Lint JavaScript/CSS (shifter_platform)
    needs: [paths]
    if: ${{ (needs.paths.outputs.run_all == 'true' || needs.paths.outputs.shifter_platform == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.19'
          cache: 'npm'
          cache-dependency-path: shifter/shifter_platform/package-lock.json

      - name: Install dependencies
        working-directory: shifter/shifter_platform
        run: npm ci

      - name: Lint JavaScript
        working-directory: shifter/shifter_platform
        run: npx eslint static/js/

      - name: Lint CSS
        working-directory: shifter/shifter_platform
        run: npx stylelint static/css/

  shifter-platform-spa:
    permissions:
      contents: read
    name: SPA (shifter_platform frontend)
    needs: [paths]
    if: ${{ (needs.paths.outputs.run_all == 'true' || needs.paths.outputs.shifter_platform == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.19'
          cache: 'npm'
          cache-dependency-path: shifter/shifter_platform/frontend/package-lock.json

      - name: Install dependencies
        working-directory: shifter/shifter_platform/frontend
        run: npm ci

      - name: Lint (ESLint)
        working-directory: shifter/shifter_platform/frontend
        run: npm run lint

      - name: Typecheck
        working-directory: shifter/shifter_platform/frontend
        run: npm run typecheck

      - name: Unit tests (Vitest + axe)
        working-directory: shifter/shifter_platform/frontend
        run: npm run test:coverage

      # Publish the SPA LCOV so the sonarcloud job can measure SPA coverage
      # against the raes-strict new-code gate (#1526). Fail closed: a missing
      # report means the coverage producer did not run.
      - name: Upload SPA coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-shifter-platform-spa
          path: shifter/shifter_platform/frontend/coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

      - name: Build (Vite)
        working-directory: shifter/shifter_platform/frontend
        run: npm run build

  # ===========================================================================
  # Authenticated SPA E2E (#1526 Slice B). Hermetic PR lane: builds the real
  # Django-hosted SPA, migrates a fresh job-local PostgreSQL, seeds synthetic
  # actors, and drives Playwright journeys through normal session/CSRF. No
  # cloud/provisioner/live-range dependency (LOCAL_PROVISIONER/ENGINE_TASK_* are
  # unset), contents:read only, no id-token, no protected environment. Traces are
  # never uploaded (ADR-055-R7); debug by local reproduction.
  # ===========================================================================
  shifter-platform-e2e:
    permissions:
      contents: read
    name: SPA E2E (shifter_platform frontend)
    needs: [paths]
    if: ${{ !inputs.skip_tests && (needs.paths.outputs.run_all == 'true' || needs.paths.outputs.shifter_platform == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TESTING: "1"
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.19'
          cache: 'npm'
          cache-dependency-path: shifter/shifter_platform/frontend/package-lock.json

      - name: Install Python dependencies
        working-directory: shifter/shifter_platform
        run: uv sync --group dev

      - name: Install frontend dependencies
        working-directory: shifter/shifter_platform/frontend
        run: npm ci

      - name: Build SPA
        working-directory: shifter/shifter_platform/frontend
        run: npm run build

      - name: Collect static files
        working-directory: shifter/shifter_platform
        run: |
          uv run python manage.py collectstatic --noinput

      - name: Install Playwright browser
        working-directory: shifter/shifter_platform/frontend
        run: npx playwright install --with-deps chromium

      - name: Authenticated E2E (Playwright)
        working-directory: shifter/shifter_platform
        run: ./scripts/run_openfga_integration.sh --browser npm run test:e2e

  # ===========================================================================
  # /api/v1/ OpenAPI contract gates (#1329, ADR-040)
  #
  # Drift gate: a fresh, hermetic generation must match the committed artifact.
  # SPA-types gate: schema.d.ts must be the artifact's generated projection.
  # Breaking-change gate: the committed artifact must not make consumer-breaking
  # changes to /api/v1/ versus the base branch's already-published artifact
  # (trusted base SHA, never a baseline this PR can rewrite). Compatibility
  # semantics come from a pinned OpenAPI-aware checker (oasdiff), not ad hoc
  # shell. Read-only permissions, no cloud, no database.
  # ===========================================================================
  shifter-platform-api-contract:
    permissions:
      contents: read
    name: API contract (shifter_platform)
    needs: [paths]
    if: ${{ (needs.paths.outputs.run_all == 'true' || needs.paths.outputs.shifter_platform == 'true') }}
    runs-on: ubuntu-latest
    env:
      OASDIFF_VERSION: "1.23.0"
      OASDIFF_SHA256: "972b10535c3db4366b9dc3ebc11ca021279af3095267c3cffdca854a3a3c4f89"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Base-branch history is required for the breaking-change comparison.
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.19'
          cache: 'npm'
          cache-dependency-path: shifter/shifter_platform/frontend/package-lock.json

      - name: Install Python dependencies
        working-directory: shifter/shifter_platform
        run: uv sync --group dev

      - name: Install frontend dependencies
        working-directory: shifter/shifter_platform/frontend
        run: npm ci

      - name: Drift gate (committed artifact matches DRF surface)
        working-directory: shifter/shifter_platform
        env:
          TESTING: "1"
          TEST_DB_BACKEND: sqlite
          DJANGO_DEBUG: "true"
          DJANGO_SECRET_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
        run: uv run python manage.py api_contract --check

      - name: SPA types match the committed contract
        working-directory: shifter/shifter_platform/frontend
        run: |
          npx openapi-typescript ../openapi/v1.json -o src/api/schema.d.ts
          git diff --exit-code -- src/api/schema.d.ts

      - name: Install oasdiff (pinned, checksum-verified)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/oasdiff.tar.gz \
            "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          echo "${OASDIFF_SHA256}  /tmp/oasdiff.tar.gz" | sha256sum -c -
          tar -xzf /tmp/oasdiff.tar.gz -C /usr/local/bin oasdiff
          oasdiff --version

      - name: Breaking-change gate (vs base branch contract)
        if: ${{ github.event_name == 'pull_request' }}
        working-directory: shifter/shifter_platform
        env:
          TESTING: "1"
          TEST_DB_BACKEND: sqlite
          DJANGO_DEBUG: "true"
          DJANGO_SECRET_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: uv run python manage.py api_contract --breaking-against "${BASE_SHA}"

  provisioner-lint:
    permissions:
      contents: read
    name: Lint (provisioner)
    needs: [paths]
    if: ${{ (needs.paths.outputs.run_all == 'true' || needs.paths.outputs.provisioner == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Lint Python
        working-directory: shifter/engine/provisioner
        run: |
          uv sync --group dev
          uv run ruff check .
          uv run ruff format --check .

  packer-lint:
    permissions:
      contents: read
    name: Lint (packer)
    needs: [paths]
    if: ${{ (needs.paths.outputs.run_all == 'true' || needs.paths.outputs.packer == 'true') }}
    runs-on: ubuntu-latest
    steps:
