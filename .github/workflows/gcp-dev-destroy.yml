name: GCP Environment Destroy

# Manually-dispatched teardown of a GCP tenant's platform-core Terraform stack.
# The `environment` input selects the tenant (gcp-dev/orthanc/sauron/balrog); the
# state prefix and the destroy GitHub Environment are derived from it.
# Authenticates with the tenant's destroy Workload Identity Federation identity
# (env-scoped to `<environment>-destroy`), so no local credentials are needed.
#
# This workflow is a thin wrapper over `deploy.py gcp-destroy` (ADR-070, #2571),
# the same command that an operator runs without GitHub. The command renders the
# same Terraform inputs as the deploy, lifts Cloud SQL deletion protection,
# removes the permanent Artifact Registry KMS key ring and key from state, and
# runs `terraform destroy` with bounded retries.
#
# Runs on ubuntu-latest: teardown deletes resources through the GCP control-plane
# APIs over WIF and needs no in-VPC or Kubernetes API access, so it does not
# require the tenant's self-hosted runner (which not every tenant has).

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Which GCP tenant to tear down.'
        required: true
        type: choice
        options:
          - gcp-dev
          - orthanc
          - sauron
          - balrog
      confirm:
        description: 'Type DESTROY to confirm teardown of the selected tenant stack.'
        required: true
        type: string

permissions:
  contents: read

jobs:
  destroy:
    name: Destroy (${{ inputs.environment }})
    runs-on: ubuntu-latest
    # The GCP destroy secrets are scoped to the <environment>-destroy Environment;
    # without this the destroy job reads them as empty repo-level secrets and
    # fails auth before any teardown.
    environment: ${{ inputs.environment }}-destroy
    permissions:
      contents: read
      id-token: write
    env:
      GCP_ENVIRONMENT: ${{ inputs.environment }}
      GCP_DESTROY_SERVICE_ACCOUNT: ${{ secrets.GCP_DESTROY_SERVICE_ACCOUNT }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
    steps:
      - name: Validate confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "${CONFIRM}" != "DESTROY" ]; then
            echo "::error::Confirmation failed. Type DESTROY exactly to proceed."
            exit 1
          fi

      - name: Reject non-protected dispatch refs
        run: |
          case "${GITHUB_REF}" in
            refs/heads/dev|refs/heads/main) ;;
            *)
              echo "::error::GCP environment destroy must run from dev or main; got '${GITHUB_REF}'."
              exit 1
              ;;
          esac

      - name: Preflight - required destroy secrets present
        # Fail fast, before checkout/auth, with the complete list of any secrets
        # missing from the selected `<environment>-destroy` Environment, rather
        # than discovering them one at a time mid-run.
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_PUBLIC_HOSTNAME: ${{ secrets.GCP_PUBLIC_HOSTNAME }}
          GCP_IDENTITY_ALLOWED_EMAIL_DOMAIN: ${{ secrets.GCP_IDENTITY_ALLOWED_EMAIL_DOMAIN }}
          SHIFTER_CONFIG_GCP_DEV: ${{ secrets.SHIFTER_CONFIG_GCP_DEV }}
        run: |
          missing=""
          for name in \
            GCP_DESTROY_SERVICE_ACCOUNT \
            GCP_WORKLOAD_IDENTITY_PROVIDER \
            GCP_PROJECT_ID \
            GCP_PUBLIC_HOSTNAME \
            GCP_IDENTITY_ALLOWED_EMAIL_DOMAIN \
            SHIFTER_CONFIG_GCP_DEV; do
            if [ -z "${!name}" ]; then
              missing="${missing} ${name}"
            fi
          done
          if [ -n "${missing}" ]; then
            echo "::error::The '${GCP_ENVIRONMENT}-destroy' Environment is missing required secret(s):${missing}. Provision them (see docs/dev/deploy-secrets.md) before dispatching teardown."
            exit 1
          fi
          echo "All required destroy secrets are present for the '${GCP_ENVIRONMENT}-destroy' Environment."

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Ensure GCP auth is configured
        run: |
          if [ -z "${GCP_DESTROY_SERVICE_ACCOUNT}" ] || [ -z "${GCP_WORKLOAD_IDENTITY_PROVIDER}" ]; then
            echo "::error::GCP_DESTROY_SERVICE_ACCOUNT and GCP_WORKLOAD_IDENTITY_PROVIDER must be configured."
            exit 1
          fi

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DESTROY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          version: ">= 416.0.0"

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.16.7"
          terraform_wrapper: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Render deployment inputs
        env:
          SHIFTER_CONFIG_GCP_DEV: ${{ secrets.SHIFTER_CONFIG_GCP_DEV }}
          SHIFTER_CONFIG_OVERLAY_JSON: ${{ vars.SHIFTER_CONFIG_OVERLAY_JSON }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_PUBLIC_HOSTNAME: ${{ secrets.GCP_PUBLIC_HOSTNAME }}
          GCP_IDENTITY_ALLOWED_EMAIL_DOMAIN: ${{ secrets.GCP_IDENTITY_ALLOWED_EMAIL_DOMAIN }}
          GCP_CTF_CONTENT_BUCKET: ${{ vars.GCP_CTF_CONTENT_BUCKET }}
          RANGE_OPENVPN_ENABLED: ${{ vars.RANGE_OPENVPN_ENABLED }}
          GCP_RANGE_BACKEND: ${{ vars.GCP_RANGE_BACKEND }}
          RANGE_NETWORK_ZONE: ${{ vars.RANGE_NETWORK_ZONE }}
          RANGE_NETWORK_ZONES: ${{ vars.RANGE_NETWORK_ZONES }}
          GCP_RANGE_CELL_PROJECT_ID: ${{ vars.GCP_RANGE_CELL_PROJECT_ID }}
          GCP_RANGE_HOST_IDENTITY_POOL_SIZE: ${{ vars.GCP_RANGE_HOST_IDENTITY_POOL_SIZE }}
        # The bundle is a 0700 directory of 0600 files outside the checkout. The
        # last step removes it.
        run: |
          set -euo pipefail
          inputs="${RUNNER_TEMP}/deployment-inputs"
          uv run --project scripts/gcp --frozen python scripts/gcp/render_ci_deployment_inputs.py \
            --environment "${GCP_ENVIRONMENT}" --output "${inputs}" --purpose destroy
          echo "DEPLOYMENT_INPUTS=${inputs}" >> "${GITHUB_ENV}"

      - name: Destroy the platform resources
        working-directory: scripts/bootstrap
        run: |
          uv run --frozen python deploy.py gcp-destroy --inputs "${DEPLOYMENT_INPUTS}" \
            --environment "${GCP_ENVIRONMENT}" --confirm "${GCP_ENVIRONMENT}" \
            --identity ambient --lock external

      - name: Remove ephemeral deployment inputs
        if: always()
        run: rm -rf "${RUNNER_TEMP}/deployment-inputs"
