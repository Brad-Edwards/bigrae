name: Packer GCE Image Build

# Builds, validates, and publishes one BigRAE guest image (#505, #2668, ADR-070
# decision 8, ADR-037-R8 and R9). It runs in a developer build project:
# deploy.py gcp-foundation creates the project and writes the gcp-image-build
# and gcp-image-validate Environments of this repository. Every job runs on a
# GitHub-hosted runner and authenticates with Workload Identity Federation; no
# long-lived service-account key exists.
#
#   build    -> one GCE image shifter-<type>-<timestamp>, with private build evidence
#   validate -> packer-gcp-validate.yml boots the exact image name and numeric ID
#   publish  -> recheck the validated ID, export disk.raw, push the OCI artifact to
#               ghcr.io/<owner>/<repository>/gce-<role>, and attest its digest
#
# A guest image publishes only after its validation passes in the same run. A
# release never builds a guest: release-gcp.yml names the newest verified
# publication of each role, so a guest changes only when this workflow runs again.

on:
  workflow_dispatch:
    inputs:
      image_type:
        description: 'Guest image to build, validate, and publish (dc-prebaked publishes as the dc role)'
        required: true
        type: choice
        options:
          - ubuntu
          - kali
          - dc-prebaked
      dc_profile:
        description: 'Pre-promoted DC profile (dc-profiles/<name>.pkrvars.hcl); only used when image_type=dc-prebaked'
        required: false
        type: string
        default: ''

permissions:
  contents: read

# Queue builds of one role. A running build is never cancelled, because it owns
# cloud resources in flight.
concurrency:
  group: packer-gcp-${{ inputs.image_type }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ inputs.image_type }} GCE image
    runs-on: ubuntu-latest
    environment: gcp-image-build
    outputs:
      image_name: ${{ steps.build_gce_image.outputs.image_name }}
      image_id: ${{ steps.build_gce_image.outputs.image_id }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: shifter/packer
    env:
      IMAGE_TYPE: ${{ inputs.image_type }}
      DC_PROFILE: ${{ inputs.dc_profile }}
    steps:
      - name: Reject non-protected dispatch refs
        working-directory: ${{ github.workspace }}
        run: |
          case "${GITHUB_REF}" in
            refs/heads/dev|refs/heads/main) ;;
            *)
              echo "::error::packer-gcp builds may only run from dev or main; got '${GITHUB_REF}'."
              exit 1
              ;;
          esac

      # Build from the dispatched ref (github.sha), which GitHub already gates
      # by workflow_dispatch permission. No free-form `inputs.ref` is accepted:
      # a privileged, cloud-credentialed build must not run code from an
      # arbitrary caller-supplied branch (#505 codex security review).
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Validate DC profile
        run: |
          if [[ "$IMAGE_TYPE" == "dc-prebaked" ]]; then
            if [[ ! "$DC_PROFILE" =~ ^[a-z0-9][a-z0-9-]*$ ]] || [[ ! -f "gcp/dc-profiles/${DC_PROFILE}.pkrvars.hcl" ]]; then
              echo "::error::dc-prebaked requires an existing, explicitly selected DC profile."
              exit 1
            fi
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install dependencies
        run: uv sync --dev

      - name: Run Packer tests
        run: uv run pytest tests/ -v

      - name: Setup Packer
        uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
        with:
          version: latest

      - name: Ensure GCP build auth is configured
        env:
          GCP_PACKER_BUILD_SERVICE_ACCOUNT: ${{ secrets.GCP_PACKER_BUILD_SERVICE_ACCOUNT }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        run: |
          if [ -z "${GCP_PACKER_BUILD_SERVICE_ACCOUNT}" ] || [ -z "${GCP_WORKLOAD_IDENTITY_PROVIDER}" ]; then
            echo "::error::GCP_PACKER_BUILD_SERVICE_ACCOUNT and GCP_WORKLOAD_IDENTITY_PROVIDER must be configured for GCE image builds. See docs/dev/deploy-secrets.md."
            exit 1
          fi

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_PACKER_BUILD_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          version: ">= 416.0.0"

      - name: Resolve Packer variables from secrets/variables
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
          GCP_PACKER_ZONE: ${{ vars.GCP_PACKER_ZONE }}
          GCP_PACKER_NETWORK: ${{ vars.GCP_PACKER_NETWORK || 'default' }}
          GCP_PACKER_SUBNETWORK: ${{ vars.GCP_PACKER_SUBNETWORK || 'default' }}
          GCP_PACKER_MACHINE_TYPE: ${{ vars.GCP_PACKER_MACHINE_TYPE || 'e2-standard-2' }}
          GCP_PACKER_USE_INTERNAL_IP: ${{ vars.GCP_PACKER_USE_INTERNAL_IP || 'false' }}
          GCP_PACKER_BUILD_SERVICE_ACCOUNT: ${{ secrets.GCP_PACKER_BUILD_SERVICE_ACCOUNT }}
        run: |
          if [ -z "${GCP_PROJECT_ID}" ]; then
            echo "::error::Required secret GCP_PROJECT_ID is not set. See docs/dev/deploy-secrets.md."
            exit 1
          fi
          ZONE="${GCP_PACKER_ZONE:-${GCP_REGION}-a}"
          # The WIF caller, builder VM, Cloud Build job, and export worker share
          # the one purpose-scoped build identity. There is no fallback identity.
          BUILDER_SA="${GCP_PACKER_BUILD_SERVICE_ACCOUNT}"
          MACHINE_TYPE="${GCP_PACKER_MACHINE_TYPE}"
          # Export as PKR_VAR_* so Packer reads them from the environment — never
          # as -var CLI flags (which would expose values in the process list).
          {
            echo "PKR_VAR_project_id=${GCP_PROJECT_ID}"
            echo "PKR_VAR_zone=${ZONE}"
            echo "PKR_VAR_network=${GCP_PACKER_NETWORK}"
            echo "PKR_VAR_subnetwork=${GCP_PACKER_SUBNETWORK}"
            echo "PKR_VAR_service_account_email=${BUILDER_SA}"
            echo "PKR_VAR_image_prefix=shifter"
            echo "PKR_VAR_source_revision=${GITHUB_SHA}"
            echo "PKR_VAR_machine_type=${MACHINE_TYPE}"
            echo "PKR_VAR_use_internal_ip=${GCP_PACKER_USE_INTERNAL_IP}"
          } >> "$GITHUB_ENV"
          # Kali has no public GCP image; the kali builder instead converts the
          # debian-12 GCE base into Kali Rolling in its first provisioning script
          # (no imported base image, so no source-image secret is required).

      - name: Generate WinRM bootstrap secret (Windows/DC only)
        if: inputs.image_type == 'windows' || inputs.image_type == 'dc' || inputs.image_type == 'dc-prebaked'
        run: |
          # Throwaway local-admin password for the build-time WinRM connection.
          # For the sysprepped windows/dc images the sysprep discards it; the
          # un-sysprepped dc-prebaked image overwrites it (a2_setup resets the
          # domain Administrator, then plans/dc_setup.py rotates it per range).
          # Masked in logs and written via $GITHUB_ENV, never echoed or on argv.
          WINRM_PW="$(openssl rand -base64 24)"
          echo "::add-mask::${WINRM_PW}"
          echo "PKR_VAR_winrm_bootstrap_password=${WINRM_PW}" >> "$GITHUB_ENV"

      - name: Generate DSRM secret (pre-promoted DC only)
        if: inputs.image_type == 'dc-prebaked'
        run: |
          # Build-only DSRM (Directory Services Restore Mode) password for the
          # baked forest. Generated per build so no shared, source-controlled
          # DSRM secret ships in the image; promote-bake.ps1 requires it and
          # cleanup.ps1 strips the build transcript before capture. Masked and
          # passed via $GITHUB_ENV as a sensitive PKR var, never echoed or argv.
          DSRM_PW="$(openssl rand -base64 24)"
          echo "::add-mask::${DSRM_PW}"
          echo "PKR_VAR_dc_dsrm_password=${DSRM_PW}" >> "$GITHUB_ENV"

      - name: Initialize Packer
        working-directory: shifter/packer/gcp
        run: packer init .

      - name: Validate template
        working-directory: shifter/packer/gcp
        run: |
          # dc-prebaked bakes many DC images from one template; the profile
          # var-file supplies the domain / NetBIOS / content / purpose.
          VARFILE=""
          if [ "${IMAGE_TYPE}" = "dc-prebaked" ]; then
            VARFILE="-var-file=dc-profiles/${DC_PROFILE}.pkrvars.hcl"
          fi
          # shellcheck disable=SC2086
          packer validate -only="googlecompute.${IMAGE_TYPE}" ${VARFILE} .

      - name: Build GCE image
        id: build_gce_image
        working-directory: shifter/packer/gcp
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          VARFILE=""
          if [ "${IMAGE_TYPE}" = "dc-prebaked" ]; then
            VARFILE="-var-file=dc-profiles/${DC_PROFILE}.pkrvars.hcl"
          fi
          # shellcheck disable=SC2086
          packer build -color=false -only="googlecompute.${IMAGE_TYPE}" ${VARFILE} .
          IMAGE_NAME=$(jq -r '.builds[-1].artifact_id' "${IMAGE_TYPE}-manifest.json")
          IMAGE_ID="$(gcloud compute images describe "${IMAGE_NAME}" \
            --project="${GCP_PROJECT_ID}" --format='value(id)')"
          IMAGE_FAMILY="$(gcloud compute images describe "${IMAGE_NAME}" \
            --project="${GCP_PROJECT_ID}" --format='value(family)')"
          IMAGE_SOURCE_REVISION="$(gcloud compute images describe "${IMAGE_NAME}" \
            --project="${GCP_PROJECT_ID}" --format='value(labels.source-revision)')"
          if ! printf '%s' "${IMAGE_NAME}" | grep -qE '^[a-z]([-a-z0-9]{0,61}[a-z0-9])?$'; then
            echo "::error::Built image name is not a valid GCE image resource name."
            exit 1
          fi
          if ! printf '%s' "${IMAGE_ID}" | grep -qE '^[0-9]+$'; then
            echo "::error::Built image has no valid server-assigned numeric ID."
            exit 1
          fi
          if [ "${IMAGE_SOURCE_REVISION}" != "${GITHUB_SHA}" ]; then
            echo "::error::Built image source-revision label does not match the dispatched commit."
            exit 1
          fi
          {
            echo "BUILT_IMAGE_NAME=${IMAGE_NAME}"
            echo "BUILT_IMAGE_ID=${IMAGE_ID}"
            echo "BUILT_IMAGE_FAMILY=${IMAGE_FAMILY}"
          } >> "${GITHUB_ENV}"
          {
            echo "image_id=${IMAGE_ID}"
            echo "image_name=${IMAGE_NAME}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## GCE Image Build Complete"
            echo "- **Type:** ${IMAGE_TYPE}"
            echo "- **Image:** \`${IMAGE_NAME}\` (ID \`${IMAGE_ID}\`)"
            echo "- **Family:** \`${IMAGE_FAMILY}\`"
            echo ""
            echo "**Next step:** the validate job boots this exact candidate; the publish job runs only after it passes."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Store immutable build-source evidence
        working-directory: shifter/packer/gcp
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          umask 077
          evidence="${RUNNER_TEMP}/gce-build-evidence.json"
          jq -n \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg workflow ".github/workflows/packer-gcp.yml" \
            --arg source_ref "${GITHUB_REF}" \
            --arg source_revision "${GITHUB_SHA}" \
            --arg image_name "${BUILT_IMAGE_NAME}" \
            --argjson image_id "${BUILT_IMAGE_ID}" \
            --arg image_family "${BUILT_IMAGE_FAMILY}" \
            --arg image_type "${IMAGE_TYPE}" \
            --arg environment "gcp-image-build" \
            --argjson build_run "${GITHUB_RUN_ID}" \
            --argjson build_run_attempt "${GITHUB_RUN_ATTEMPT}" \
            '{
              schema_version: 1,
              repository: $repository,
              workflow: $workflow,
              source_ref: $source_ref,
              source_revision: $source_revision,
              image_name: $image_name,
              image_id: $image_id,
              image_family: $image_family,
              image_type: $image_type,
              environment: $environment,
              build_run: $build_run,
              build_run_attempt: $build_run_attempt
            }' > "${evidence}"
          if ! gcloud storage cp --quiet "${evidence}" \
            "gs://${GCP_PROJECT_ID}-release-evidence/packer-builds/${BUILT_IMAGE_ID}/build-evidence.json" \
            >/dev/null 2>&1; then
            echo "::error::Failed to store immutable build-source evidence."
            exit 1
          fi

      - name: Upload manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.image_type }}-gce-manifest
          path: shifter/packer/gcp/${{ inputs.image_type }}-manifest.json

      - name: Remove local build-source evidence
        if: always()
        run: rm -f "${RUNNER_TEMP}/gce-build-evidence.json"

  validate:
    name: Validate ${{ inputs.image_type }} candidate
    needs: build
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/packer-gcp-validate.yml
    with:
      image_type: ${{ inputs.image_type }}
      dc_profile: ${{ inputs.dc_profile }}
      source_image: ${{ needs.build.outputs.image_name }}

  publish:
    name: Publish ${{ inputs.image_type }} guest image
    # Runs only when the build and the validation of this exact candidate both
    # succeeded in this run (ADR-037-R8). A failed, skipped, or cancelled
    # validation stops it before any export.
    needs: [build, validate]
    runs-on: ubuntu-latest
    environment: gcp-image-build
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    env:
      IMAGE_TYPE: ${{ inputs.image_type }}
      BUILT_IMAGE_NAME: ${{ needs.build.outputs.image_name }}
      BUILT_IMAGE_ID: ${{ needs.build.outputs.image_id }}
      VALIDATED_IMAGE_ID: ${{ needs.validate.outputs.image_id }}
    steps:
      - name: Reject non-protected dispatch refs
        run: |
          case "${GITHUB_REF}" in
            refs/heads/dev|refs/heads/main) ;;
            *)
              echo "::error::Guest image publication requires refs/heads/dev or refs/heads/main, not '${GITHUB_REF}'."
              exit 1
              ;;
          esac

      - name: Check the validated candidate
        run: |
          set -euo pipefail
          if ! printf '%s' "${BUILT_IMAGE_ID}" | grep -qE '^[0-9]+$' \
            || [ "${VALIDATED_IMAGE_ID}" != "${BUILT_IMAGE_ID}" ]; then
            echo "::error::The validated image is not the image that this run built."
            exit 1
          fi
          if ! printf '%s' "${BUILT_IMAGE_NAME}" | grep -qE '^[a-z]([-a-z0-9]{0,61}[a-z0-9])?$'; then
            echo "::error::The built image name is not a valid GCE image resource name."
            exit 1
          fi
          # dc-prebaked is the only DC that the GCE range backend boots; it
          # publishes under the dc role.
          case "${IMAGE_TYPE}" in
            ubuntu|kali) ROLE="${IMAGE_TYPE}" ;;
            dc-prebaked) ROLE="dc" ;;
            *) echo "::error::No published role for image type ${IMAGE_TYPE}."; exit 1 ;;
          esac
          echo "ROLE=${ROLE}" >> "${GITHUB_ENV}"

      - name: Ensure GCP build auth is configured
        env:
          GCP_PACKER_BUILD_SERVICE_ACCOUNT: ${{ secrets.GCP_PACKER_BUILD_SERVICE_ACCOUNT }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_GCE_BASE_IMAGE_BUCKET: ${{ vars.GCP_GCE_BASE_IMAGE_BUCKET }}
        run: |
          if [ -z "${GCP_PACKER_BUILD_SERVICE_ACCOUNT}" ] || [ -z "${GCP_WORKLOAD_IDENTITY_PROVIDER}" ] \
            || [ -z "${GCP_GCE_BASE_IMAGE_BUCKET}" ]; then
            echo "::error::The gcp-image-build Environment is incomplete. Run deploy.py gcp-foundation for the build project."
            exit 1
          fi

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_PACKER_BUILD_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          version: ">= 416.0.0"

      # Names can be reused after a deletion; numeric IDs cannot. The labels are
      # locators that the validation job wrote; the needs gate above is the authority.
      - name: Recheck the validated candidate in the build project
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          describe() {
            gcloud compute images describe "${BUILT_IMAGE_NAME}" --project="${GCP_PROJECT_ID}" --format="value($1)"
          }
          if [ "$(describe id)" != "${BUILT_IMAGE_ID}" ] \
            || [ "$(describe labels.validated)" != "passed" ] \
            || [ "$(describe labels.validated-image-id)" != "${BUILT_IMAGE_ID}" ] \
            || [ "$(describe labels.validated-run)" != "${GITHUB_RUN_ID}" ] \
            || [ "$(describe labels.source-revision)" != "${GITHUB_SHA}" ]; then
            echo "::error::The candidate does not carry the validation of this run."
            exit 1
          fi

      # The export writes a GCE-native disk.raw tarball: the default output of
      # `gcloud compute images export`, which `gcloud compute images create
      # --source-uri` imports with no conversion. It runs as a Cloud Build job
      # that starts a Daisy worker VM. Both identities are pinned to the build
      # identity, and the worker is pinned to the internal-IP builder subnet for
      # the compute.vmExternalIpAccess org policy.
      - name: Export the validated image as a GCE disk tarball
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_GCE_BASE_IMAGE_BUCKET: ${{ vars.GCP_GCE_BASE_IMAGE_BUCKET }}
          GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
          GCP_PACKER_ZONE: ${{ vars.GCP_PACKER_ZONE }}
          GCP_PACKER_SUBNETWORK: ${{ vars.GCP_PACKER_SUBNETWORK }}
          GCP_PACKER_BUILD_SERVICE_ACCOUNT: ${{ secrets.GCP_PACKER_BUILD_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          ZONE="${GCP_PACKER_ZONE:-${GCP_REGION}-a}"
          # The object is keyed on the numeric image ID.
          OBJECT="${ROLE}-${BUILT_IMAGE_ID}.tar.gz"
          echo "EXPORT_OBJECT=${OBJECT}" >> "${GITHUB_ENV}"
          gcloud compute images export \
            --image="${BUILT_IMAGE_NAME}" \
            --destination-uri="gs://${GCP_GCE_BASE_IMAGE_BUCKET}/${OBJECT}" \
            --project="${GCP_PROJECT_ID}" \
            --zone="${ZONE}" \
            ${GCP_PACKER_SUBNETWORK:+--subnet="${GCP_PACKER_SUBNETWORK}"} \
            --cloudbuild-service-account="${GCP_PACKER_BUILD_SERVICE_ACCOUNT}" \
            --compute-service-account="${GCP_PACKER_BUILD_SERVICE_ACCOUNT}" \
            --log-location="gs://${GCP_GCE_BASE_IMAGE_BUCKET}/export-logs"

      - name: Login to the release registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install ORAS
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1

      # The artifact goes to the release registry ghcr.io/<owner>/<repository>
      # in lower case, as the application images do. The annotations describe
      # the build; the attestation below is the trust. The tag
      # run-<run number>.<attempt> orders publications: release-gcp.yml takes
      # the highest one (#2668). github.run_number increases with each run.
      - name: Push the guest image to the release registry
        id: push
        env:
          GCP_GCE_BASE_IMAGE_BUCKET: ${{ vars.GCP_GCE_BASE_IMAGE_BUCKET }}
        run: |
          set -euo pipefail
          PACKAGE="ghcr.io/${GITHUB_REPOSITORY,,}/gce-${ROLE}"
          DISK_DIR="$(mktemp -d "${RUNNER_TEMP}/gce-disk.XXXXXX")"
          DISK_FILE="${ROLE}.tar.gz"
          trap 'rm -f "${DISK_DIR}/${DISK_FILE}"; rmdir "${DISK_DIR}"' EXIT
          # ORAS hashes a file before upload. Keep the disk out of the checkout.
          gcloud storage cp --quiet "gs://${GCP_GCE_BASE_IMAGE_BUCKET}/${EXPORT_OBJECT}" "${DISK_DIR}/${DISK_FILE}"
          # ORAS rejects absolute file paths, so push the file by its relative
          # name from its own directory.
          cd "${DISK_DIR}"
          DIGEST="$(oras push --format json \
            --artifact-type application/vnd.shifter.gce-image.v1 \
            --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --annotation "com.shifter.image.role=${ROLE}" \
            --annotation "com.shifter.image.gce-image-id=${BUILT_IMAGE_ID}" \
            --annotation "com.shifter.build.run-id=${GITHUB_RUN_ID}" \
            --annotation "com.shifter.build.repository=${GITHUB_REPOSITORY}" \
            "${PACKAGE}:run-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" \
            "${DISK_FILE}:application/vnd.shifter.gce-image.tar.gz" | jq -er '.digest')"
          if ! printf '%s' "${DIGEST}" | grep -qE '^sha256:[0-9a-f]{64}$'; then
            echo "::error::ORAS did not return an OCI manifest digest."
            exit 1
          fi
          {
            echo "package=${PACKAGE}"
            echo "digest=${DIGEST}"
          } >> "${GITHUB_OUTPUT}"

      # Sign the build provenance of the exact manifest digest and push the
      # Sigstore bundle to the registry as an OCI referrer (ADR-037-R5). gcp-images
      # verifies this bundle against settings.release_trust and the build revision.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ steps.push.outputs.package }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Summarize the publication
        env:
          PACKAGE: ${{ steps.push.outputs.package }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          {
            echo "## Guest image published"
            echo "- **Role:** ${ROLE}"
            echo "- **Image:** \`${PACKAGE}@${DIGEST}\`"
            echo "- **Tag:** \`run-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}\`"
            echo "- **Build revision:** \`${GITHUB_SHA}\`"
            echo ""
            echo "The next release names this image for the ${ROLE} role."
            echo "After the first publication of this package, make the package public in the GitHub package settings."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Remove the exported disk
        if: always()
        env:
          GCP_GCE_BASE_IMAGE_BUCKET: ${{ vars.GCP_GCE_BASE_IMAGE_BUCKET }}
        run: |
          if [ -n "${EXPORT_OBJECT:-}" ]; then
            gcloud storage rm --quiet "gs://${GCP_GCE_BASE_IMAGE_BUCKET}/${EXPORT_OBJECT}" \
              || echo "::warning::The exported disk stays until the bucket lifecycle deletes it."
          fi
