name: Release (GCP)

# Builds one GCP release from main, dev, or deploy-test (#2571, #2580, #2659,
# ADR-070).
#
# Two events start the workflow (ADR-004-R23, #2660). The release-gcp job of
# release-please.yml calls it when a release tag points at the pushed main
# commit. A called workflow runs from the commit of the caller, with its github
# context, so the run builds the tagged commit from refs/heads/main. The maintainer
# dispatches it for a test build from dev or deploy-test, or to publish a
# release again.
#
# A GitHub-less GCP deployment consumes a release; it builds nothing itself. This
# workflow builds the five control-plane images once, pushes each image by
# digest to the public release registry on GHCR, and stores the SBOM and the
# signed build provenance with each image. The provenance is a Sigstore bundle
# that actions/attest-build-provenance pushes to the registry as an OCI referrer
# (push-to-registry: true), so a deployment verifies it with the Sigstore trust
# root and no GitHub API. The workflow then writes the release manifest
# (bigrae.gcp-release.v1) and builds the deployer image, which embeds the
# manifest, the source revision, the deploy tooling, and the pinned tools. The
# deployer image is attested the same way.
#
# The manifest also names the guest images (#2668). packer-gcp.yml builds,
# validates, publishes, and attests each guest image in a developer build
# project. This workflow selects the newest verified publication of each role
# and never builds, exports, or attests a guest image.
#
# The release registry is ghcr.io/<owner>/<repository>, in lower case. The
# deployer image is deployer-gcp, because it holds only the GCP tooling. The job
# publishes with the workflow GITHUB_TOKEN and needs no cloud identity. A
# deployment trusts a release through settings.release_trust, not through the
# registry, and copies each image by digest into its own Artifact Registry.
# GHCR makes a new package private; the repository owner makes each package
# public once after its first release.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version for the manifest. Empty uses version.txt.'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      version:
        description: 'Release version for the manifest. Empty uses version.txt.'
        required: false
        type: string
        default: ''
      source_revision:
        description: 'Commit that the release tags. The run stops when it is not the built commit.'
        required: true
        type: string

permissions: {}

jobs:
  release:
    name: Build and publish the GCP release
    runs-on: ubuntu-latest
    environment: gcp-release
    # One group per commit. GitHub cancels a pending run when a newer run joins
    # its group, so a shared group could drop the release of another commit.
    # Runs for different commits publish different tags and run in parallel.
    concurrency:
      group: release-gcp-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    env:
      RELEASE_VERSION_INPUT: ${{ inputs.version }}
      RELEASE_SOURCE_REVISION_INPUT: ${{ inputs.source_revision }}
    steps:
      # Reject every ref except main, dev, and deploy-test BEFORE checkout and
      # the registry login. The gcp-release Environment branch policy admits
      # the same refs, so this step is defense in depth (ADR-037-R7).
      - name: Reject non-protected dispatch refs
        run: |
          case "${GITHUB_REF}" in
            refs/heads/main|refs/heads/dev|refs/heads/deploy-test) ;;
            *)
              echo "::error::release-gcp must run from refs/heads/main, refs/heads/dev, or refs/heads/deploy-test, not '${GITHUB_REF}'. See ADR-037-R7."
              exit 1
              ;;
          esac

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Validate the release configuration
        env:
          REPOSITORY: ${{ github.repository }}
          RELEASE_TRIGGER: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # A called run has the event of its caller, not workflow_dispatch. It
          # builds the commit of the caller, so it must name the tagged commit,
          # and that commit must be the built commit.
          if [ "${RELEASE_TRIGGER}" != "workflow_dispatch" ] || [ -n "${RELEASE_SOURCE_REVISION_INPUT}" ]; then
            if ! [[ "${RELEASE_SOURCE_REVISION_INPUT}" =~ ^[0-9a-f]{40}$ ]] || [ "${RELEASE_SOURCE_REVISION_INPUT}" != "${GITHUB_SHA}" ]; then
              echo "::error::The source_revision input must be the full SHA of the built commit ${GITHUB_SHA}."
              exit 1
            fi
          fi
          version="${RELEASE_VERSION_INPUT:-$(tr -d '[:space:]' < version.txt)}"
          chart_version="$(awk '$1 == "version:" { print $2; exit }' platform/charts/shifter/Chart.yaml)"
          # Check the values against the release manifest patterns
          # (shifter/installation/gcp_release.py) before they reach GITHUB_ENV.
          # A newline in a value could otherwise add an environment variable.
          if ! [[ "${version}" =~ ^[0-9A-Za-z][0-9A-Za-z.+_-]{0,63}$ ]]; then
            echo "::error::The release version is not valid. Use 1 to 64 letters, digits, '.', '+', '_', or '-'."
            exit 1
          fi
          if ! [[ "${chart_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::The chart version in platform/charts/shifter/Chart.yaml is not valid."
            exit 1
          fi
          {
            echo "RELEASE_REGISTRY=ghcr.io/${REPOSITORY,,}"
            echo "RELEASE_VERSION=${version}"
            echo "RELEASE_CHART_VERSION=${chart_version}"
          } >> "${GITHUB_ENV}"

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install pinned ORAS
        env:
          ORAS_VERSION: 1.3.6
          ORAS_SHA256: 66fb0ad7206f3f6fa77ed5b552049d364ccf4b50b1684554f731f76302b52ca0
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/oras-bin"
          curl -fsSL -o "${RUNNER_TEMP}/oras.tar.gz" \
            "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          echo "${ORAS_SHA256}  ${RUNNER_TEMP}/oras.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/oras.tar.gz" -C "${RUNNER_TEMP}/oras-bin" oras
          echo "${RUNNER_TEMP}/oras-bin" >> "${GITHUB_PATH}"

      # The release names the exact guest images that each tenant imports
      # (#2679, #2668). It takes the newest publication of each role from
      # packer-gcp.yml and records it only when its build provenance verifies
      # against this repository, from dev or main. This runs before any image
      # build, so a missing or unsigned guest stops the release early. The
      # release never builds a guest image.
      - name: Select the guest images
        env:
          TRUSTED_REPOSITORY_ID: ${{ github.repository_id }}
          TRUSTED_OWNER_ID: ${{ github.repository_owner_id }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/release"
          uv run --frozen --project scripts/bootstrap scripts/bootstrap/deploy.py gcp-images --resolve \
            --registry "${RELEASE_REGISTRY}" \
            --trusted-repository-id "${TRUSTED_REPOSITORY_ID}" --trusted-owner-id "${TRUSTED_OWNER_ID}" \
            > "${RUNNER_TEMP}/release/base-images.json"
          python3 -c 'import json,sys; m=json.load(open(sys.argv[1])); assert set(m) == {"kali","ubuntu","dc"}' \
            "${RUNNER_TEMP}/release/base-images.json"

      - name: Login to the release registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # The five control-plane images build exactly as the CI deploy builds them
      # (_gcp-dev.yml): the same contexts, Dockerfiles, and build arguments, no
      # cache, an SBOM, and maximum build provenance (ADR-037-R5).
      - name: Build and push portal image
        id: build-portal
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./shifter
          file: ./shifter/shifter_platform/Dockerfile
          build-args: |
            SOURCE_REPOSITORY_URL=${{ github.server_url }}/${{ github.repository }}
          push: true
          tags: |
            ${{ env.RELEASE_REGISTRY }}/portal:${{ github.sha }}
          no-cache: true
          provenance: mode=max
          sbom: true
      - name: Build and push provisioner image
        id: build-provisioner
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./shifter
          file: ./shifter/engine/provisioner/Dockerfile
          build-args: |
            SOURCE_REPOSITORY_URL=${{ github.server_url }}/${{ github.repository }}
          push: true
          tags: |
            ${{ env.RELEASE_REGISTRY }}/provisioner:${{ github.sha }}
          no-cache: true
          provenance: mode=max
          sbom: true
      - name: Build and push guacd image
        id: build-guacd
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./shifter/engine/guacd
          push: true
          tags: |
            ${{ env.RELEASE_REGISTRY }}/guacd:${{ github.sha }}
          no-cache: true
          provenance: mode=max
          sbom: true
      - name: Build and push guacamole-client image
        id: build-guacamole-client
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./shifter/engine/guacamole
          push: true
          tags: |
            ${{ env.RELEASE_REGISTRY }}/guacamole-client:${{ github.sha }}
          no-cache: true
          provenance: mode=max
          sbom: true
      - name: Build and push OpenVPN pool image
        id: build-openvpn
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./shifter/engine/openvpn
          build-args: |
            SOURCE_REPOSITORY_URL=${{ github.server_url }}/${{ github.repository }}
          push: true
          tags: |
            ${{ env.RELEASE_REGISTRY }}/openvpn:${{ github.sha }}
          no-cache: true
          provenance: mode=max
          sbom: true

      # Sign the build provenance of each exact digest and push the Sigstore
      # bundle to the registry next to the image (ADR-037-R5).
      - name: Attest build provenance (portal)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.RELEASE_REGISTRY }}/portal
          subject-digest: ${{ steps.build-portal.outputs.digest }}
          push-to-registry: true
      - name: Attest build provenance (provisioner)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.RELEASE_REGISTRY }}/provisioner
          subject-digest: ${{ steps.build-provisioner.outputs.digest }}
          push-to-registry: true
      - name: Attest build provenance (guacd)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.RELEASE_REGISTRY }}/guacd
          subject-digest: ${{ steps.build-guacd.outputs.digest }}
          push-to-registry: true
      - name: Attest build provenance (guacamole-client)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.RELEASE_REGISTRY }}/guacamole-client
          subject-digest: ${{ steps.build-guacamole-client.outputs.digest }}
          push-to-registry: true
      - name: Attest build provenance (openvpn)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.RELEASE_REGISTRY }}/openvpn
          subject-digest: ${{ steps.build-openvpn.outputs.digest }}
          push-to-registry: true

      # The release carries the OpenFGA authorization model that each deploy
      # publishes (#2679).
      - name: Render the authorization model
        working-directory: shifter/shifter_platform
        env:
          OPENFGA_CLI_IMAGE: openfga/cli@sha256:26acde96d90420e53fe361a740dcceba4b67f1c49e4f35117cd0c19c83ac5068
          TESTING: "1"
          ENVIRONMENT: test
          TEST_DB_BACKEND: sqlite
          DJANGO_SECRET_KEY: release-model-render-only
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/release"
          model_dsl="$(uv run --frozen --no-dev python manage.py render_openfga_model)"
          docker run --rm "${OPENFGA_CLI_IMAGE}" model transform "${model_dsl}" \
            --input-format fga --output-format json > "${RUNNER_TEMP}/release/authorization-model.json"
          python3 -c 'import json,sys; m=json.load(open(sys.argv[1])); assert m["type_definitions"]' \
            "${RUNNER_TEMP}/release/authorization-model.json"
      # The installation CLI validates the manifest: the schema, the full source
      # revision, the chart version, one exact repository@sha256 identity for
      # each of the five images, and the guest images.
      - name: Write the release manifest
        env:
          PORTAL_DIGEST: ${{ steps.build-portal.outputs.digest }}
          PROVISIONER_DIGEST: ${{ steps.build-provisioner.outputs.digest }}
          GUACD_DIGEST: ${{ steps.build-guacd.outputs.digest }}
          GUACAMOLE_CLIENT_DIGEST: ${{ steps.build-guacamole-client.outputs.digest }}
          OPENVPN_DIGEST: ${{ steps.build-openvpn.outputs.digest }}
        working-directory: shifter/installation
        run: |
          set -euo pipefail
          mapfile -t base_images < <(python3 -c 'import json,sys; [print(f"--base-image={r}={i}") for r, i in sorted(json.load(open(sys.argv[1])).items())]' "${RUNNER_TEMP}/release/base-images.json")
          uv run --frozen shifter-config gcp-release-manifest \
            --version "${RELEASE_VERSION}" \
            --source-revision "${GITHUB_SHA}" \
            --chart-version "${RELEASE_CHART_VERSION}" \
            --authorization-model-stdin \
            "${base_images[@]}" \
            --image "portal=${RELEASE_REGISTRY}/portal@${PORTAL_DIGEST}" \
            --image "provisioner=${RELEASE_REGISTRY}/provisioner@${PROVISIONER_DIGEST}" \
            --image "guacd=${RELEASE_REGISTRY}/guacd@${GUACD_DIGEST}" \
            --image "guacamole-client=${RELEASE_REGISTRY}/guacamole-client@${GUACAMOLE_CLIENT_DIGEST}" \
            --image "openvpn=${RELEASE_REGISTRY}/openvpn@${OPENVPN_DIGEST}" \
            < "${RUNNER_TEMP}/release/authorization-model.json" \
            > "${RUNNER_TEMP}/release/release.json"

      # The deployer image embeds the manifest and the source revision. Its build
      # stops when the manifest is not valid or names another revision.
      - name: Build and push deployer image
        id: build-deployer
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: ./platform/deployer/gcp/Dockerfile
          build-contexts: |
            release=${{ runner.temp }}/release
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
            SOURCE_REPOSITORY_URL=${{ github.server_url }}/${{ github.repository }}
          push: true
          tags: |
            ${{ env.RELEASE_REGISTRY }}/deployer-gcp:${{ github.sha }}
          no-cache: true
          provenance: mode=max
          sbom: true
      - name: Install pinned Trivy
        env:
          TRIVY_VERSION: 0.76.1
          TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/trivy-bin"
          curl -fsSL -o "${RUNNER_TEMP}/trivy.tar.gz" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  ${RUNNER_TEMP}/trivy.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/trivy.tar.gz" -C "${RUNNER_TEMP}/trivy-bin" trivy
      # A HIGH or CRITICAL finding with a fix blocks. The only accepted
      # exposures are the time-boxed vendor-binary entries in
      # platform/deployer/gcp/trivyignore.yaml.
      - name: Scan the deployer image
        env:
          DEPLOYER_DIGEST: ${{ steps.build-deployer.outputs.digest }}
        run: |
          "${RUNNER_TEMP}/trivy-bin/trivy" image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --ignorefile platform/deployer/gcp/trivyignore.yaml \
            --db-repository mirror.gcr.io/aquasec/trivy-db \
            --java-db-repository mirror.gcr.io/aquasec/trivy-java-db \
            --exit-code 1 "${RELEASE_REGISTRY}/deployer-gcp@${DEPLOYER_DIGEST}"
      - name: Attest build provenance (deployer)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.RELEASE_REGISTRY }}/deployer-gcp
          subject-digest: ${{ steps.build-deployer.outputs.digest }}
          push-to-registry: true

      - name: Summarize the release
        env:
          DEPLOYER_DIGEST: ${{ steps.build-deployer.outputs.digest }}
        run: |
          set -euo pipefail
          {
            echo "## GCP release ${RELEASE_VERSION}"
            echo "- **Source revision:** \`${GITHUB_SHA}\`"
            echo "- **Deployer image:** \`${RELEASE_REGISTRY}/deployer-gcp@${DEPLOYER_DIGEST}\`"
            echo "- **Release manifest:** \`/opt/bigrae/release.json\` in the deployer image"
            echo ""
            echo '```json'
            cat "${RUNNER_TEMP}/release/release.json"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Remove the local release manifest
        if: always()
        run: rm -rf "${RUNNER_TEMP}/release"
