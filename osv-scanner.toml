# OSV-Scanner policy.
#
# Policy: entries here are ONLY for advisories with NO upstream fix available
# (the latest published release is still the last-affected version) AND that are
# not reachable in this project's usage. Each entry is time-boxed via
# `ignoreUntil` so the suppression lapses and the scanner re-reports if upstream
# still has no fix at the review date. Do NOT add entries for findings that have
# a patched version — bump the dependency instead.

# No active suppressions. Previously time-boxed entries were removed once the
# corresponding dependency graphs stopped reporting those advisories.
