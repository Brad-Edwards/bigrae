{{- $runtimeEnv := include "shifter.platformRuntimeEnv" . | fromJson -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-runtime
  namespace: {{ .Values.namespaces.platform }}
  labels:
    {{- include "shifter.partOfLabels" . | nindent 4 }}
data:
  {{- range $key, $value := $runtimeEnv }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
