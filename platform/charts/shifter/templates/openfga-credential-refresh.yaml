{{- /*
Weekly OpenFGA datastore credential refresh on AWS (#2313).

The rotation function rotates each OpenFGA login every 30 days. The
alternating-users strategy keeps the previous credential valid until the next
rotation. This CronJob copies the current credentials into their named Secrets
and restarts the two policy servers, which read credentials at startup. Its Role
allows only `patch` on those three Secrets and two Deployments; it reads no
Secret. An admission policy limits each Deployment patch to the restart
annotation. Its IRSA role reads only the three datastore secrets.
*/ -}}
{{- if and .Values.openfga.enabled .Values.openfga.passwordDatastore.enabled }}
{{- $refresh := .Values.openfga.passwordDatastore.credentialRefresh }}
{{- $subject := printf "system:serviceaccount:%s:openfga-credential-refresh" .Values.namespaces.platform }}
{{- if not .Values.network.kubernetesApiCidrs }}
{{- fail "network.kubernetesApiCidrs is required for the OpenFGA credential refresh" }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openfga-credential-refresh
  namespace: {{ .Values.namespaces.platform }}
  labels:
    {{- include "shifter.partOfLabels" . | nindent 4 }}
    app.kubernetes.io/component: openfga-credential-refresh
  annotations:
    eks.amazonaws.com/role-arn: {{ required "identity.serviceAccountRoleArns.policyCredentialRefresh is required" .Values.identity.serviceAccountRoleArns.policyCredentialRefresh | quote }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openfga-credential-refresh
  namespace: {{ .Values.namespaces.platform }}
  labels:
    {{- include "shifter.partOfLabels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [openfga-runtime-datastore, openfga-admin-datastore, openfga-migrator-datastore]
    verbs: [patch]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [openfga, openfga-admin]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openfga-credential-refresh
  namespace: {{ .Values.namespaces.platform }}
  labels:
    {{- include "shifter.partOfLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openfga-credential-refresh
subjects:
  - kind: ServiceAccount
    name: openfga-credential-refresh
    namespace: {{ .Values.namespaces.platform }}
---
# RBAC names the Deployments but not the fields. A patch from the refresh
# identity may set only the restart annotation; any other change is denied.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: restrict-openfga-credential-refresh
  labels:
    {{- include "shifter.partOfLabels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [UPDATE]
        resources: [deployments]
  matchConditions:
    - name: refresh-identity
      expression: "request.userInfo.username == '{{ $subject }}'"
  variables:
    - name: key
      expression: "'shifter.dev/policy-credentials-refreshed-at'"
    - name: newAnnotations
      expression: "has(object.spec.template.metadata.annotations) ? object.spec.template.metadata.annotations : {}"
    - name: oldAnnotations
      expression: "has(oldObject.spec.template.metadata.annotations) ? oldObject.spec.template.metadata.annotations : {}"
  validations:
    - expression: >-
        (has(object.metadata.labels) ? object.metadata.labels : {}) ==
        (has(oldObject.metadata.labels) ? oldObject.metadata.labels : {}) &&
        (has(object.metadata.annotations) ? object.metadata.annotations : {}) ==
        (has(oldObject.metadata.annotations) ? oldObject.metadata.annotations : {})
      message: The credential refresh may not change Deployment labels or annotations.
    - expression: >-
        has(object.spec.replicas) == has(oldObject.spec.replicas) &&
        (!has(object.spec.replicas) || object.spec.replicas == oldObject.spec.replicas) &&
        object.spec.selector == oldObject.spec.selector &&
        has(object.spec.strategy) == has(oldObject.spec.strategy) &&
        (!has(object.spec.strategy) || object.spec.strategy == oldObject.spec.strategy) &&
        has(object.spec.minReadySeconds) == has(oldObject.spec.minReadySeconds) &&
        (!has(object.spec.minReadySeconds) || object.spec.minReadySeconds == oldObject.spec.minReadySeconds) &&
        has(object.spec.revisionHistoryLimit) == has(oldObject.spec.revisionHistoryLimit) &&
        (!has(object.spec.revisionHistoryLimit) || object.spec.revisionHistoryLimit == oldObject.spec.revisionHistoryLimit) &&
        has(object.spec.progressDeadlineSeconds) == has(oldObject.spec.progressDeadlineSeconds) &&
        (!has(object.spec.progressDeadlineSeconds) || object.spec.progressDeadlineSeconds == oldObject.spec.progressDeadlineSeconds) &&
        has(object.spec.paused) == has(oldObject.spec.paused) &&
        (!has(object.spec.paused) || object.spec.paused == oldObject.spec.paused)
      message: The credential refresh may not change the Deployment rollout settings.
    - expression: "object.spec.template.spec == oldObject.spec.template.spec"
      message: The credential refresh may not change the pod spec.
    - expression: >-
        (has(object.spec.template.metadata.labels) ? object.spec.template.metadata.labels : {}) ==
        (has(oldObject.spec.template.metadata.labels) ? oldObject.spec.template.metadata.labels : {})
      message: The credential refresh may not change pod labels.
    - expression: >-
        variables.newAnnotations.all(k, k == variables.key || (k in variables.oldAnnotations && variables.oldAnnotations[k] == variables.newAnnotations[k])) &&
        variables.oldAnnotations.all(k, k == variables.key || k in variables.newAnnotations) &&
        variables.key in variables.newAnnotations
      message: The credential refresh may set only its restart annotation.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: restrict-openfga-credential-refresh
  labels:
    {{- include "shifter.partOfLabels" . | nindent 4 }}
spec:
  policyName: restrict-openfga-credential-refresh
  validationActions: [Deny]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-openfga-credential-refresh-kubernetes-api-egress
  namespace: {{ .Values.namespaces.platform }}
  labels:
    {{- include "shifter.partOfLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: openfga-credential-refresh
  policyTypes:
    - Egress
  egress:
    - to:
        {{- range .Values.network.kubernetesApiCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: openfga-credential-refresh
  namespace: {{ .Values.namespaces.platform }}
  labels:
    {{- include "shifter.partOfLabels" . | nindent 4 }}
    app.kubernetes.io/component: openfga-credential-refresh
spec:
  schedule: {{ $refresh.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            {{- include "shifter.partOfLabels" . | nindent 12 }}
            app.kubernetes.io/component: openfga-credential-refresh
        spec:
          {{- include "shifter.podSecurityContext" . | nindent 10 }}
          serviceAccountName: openfga-credential-refresh
          automountServiceAccountToken: true
          restartPolicy: Never
          containers:
            - name: refresh
              image: {{ include "shifter.portalImage" . }}
              imagePullPolicy: {{ .Values.imagePullPolicy }}
              {{- include "shifter.containerSecurityContextApp" . | nindent 14 }}
              command: ["python", "-m", "shared.cloud.policy_credential_refresh"]
              env:
                - name: OPENFGA_DATASTORE_LOGIN_ARNS
                  value: {{ required "openfga.passwordDatastore.secretArns is required" .Values.openfga.passwordDatastore.secretArns | toJson | quote }}
                - name: AWS_REGION
                  value: {{ required "runtimeEnv.AWS_REGION is required for the OpenFGA credential refresh" .Values.runtimeEnv.AWS_REGION | quote }}
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                {{- toYaml $refresh.resources | nindent 16 }}
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: {{ .Values.tmpVolume.sizeLimit | quote }}
{{- end }}
