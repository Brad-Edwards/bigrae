apiVersion: apps/v1
kind: Deployment
metadata:
  name: guacamole-client
  namespace: shifter-platform
  annotations:
    # CKV_K8S_35: DB credentials arrive through envFrom until the Guacamole image
    # file-secret fork (#2565) lands. The pinned 1.6.0 image has no _FILE support
    # (GUACAMOLE-2119). Scoped, time-boxed entry in docs/adr/exceptions.yaml.
    checkov.io/skip1: CKV_K8S_35=Guacamole 1.6.0 image has no file-secret support (GUACAMOLE-2119); fork tracked in #2565
    # CKV_K8S_43: the base manifest pins a placeholder tag; every deploy path
    # rewrites it to the attested digest (ADR-037, _gcp-dev.yml).
    checkov.io/skip2: CKV_K8S_43=placeholder image is rewritten to an attested digest at deploy (ADR-037)
  labels:
    app.kubernetes.io/part-of: shifter
    app.kubernetes.io/component: guacamole-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/part-of: shifter
      app.kubernetes.io/component: guacamole-client
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: shifter
        app.kubernetes.io/component: guacamole-client
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: guacamole-client
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 180
      containers:
        - name: guacamole-client
          image: us-docker.pkg.dev/placeholder-project/shifter/guacamole-client:0.0.0
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # The upstream guacamole start.sh rebuilds GUACAMOLE_HOME ($HOME/.guacamole)
            # on every boot (rm -Rf + mkdir), which fails under readOnlyRootFilesystem.
            # Back the whole home with an ephemeral writable volume so it can rebuild.
            - name: guac-home
              mountPath: /home/guacamole
          env:
            # UID 10001 has no passwd entry in the image, so HOME is "/" by
            # default. Set HOME to the writable home volume.
            - name: HOME
              value: /home/guacamole
            - name: OPENFGA_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: platform-runtime
                  key: OPENFGA_ENABLED
                  optional: true
            - name: GUACAMOLE_CONTROL_URL
              valueFrom:
                configMapKeyRef:
                  name: platform-runtime
                  key: GUACAMOLE_CONTROL_URL
                  optional: true
            - name: GUACAMOLE_CONTROL_AUDIENCE
              valueFrom:
                configMapKeyRef:
                  name: platform-runtime
                  key: GUACAMOLE_CONTROL_AUDIENCE
                  optional: true
            # start.sh copies from the initial GUACAMOLE_HOME as a template; the base
            # image sets it to $HOME/.guacamole, which makes the copy self-referential
            # and busy-fails. Empty it so start.sh just builds a fresh home from env.
            - name: GUACAMOLE_HOME
              value: ""
            - name: GUACD_HOSTNAME
              value: guacd
            - name: GUACD_PORT
              value: "4822"
            - name: POSTGRESQL_HOSTNAME
              valueFrom:
                configMapKeyRef:
                  name: platform-runtime
                  key: GUACAMOLE_POSTGRESQL_HOSTNAME
            - name: POSTGRESQL_PORT
              valueFrom:
                configMapKeyRef:
                  name: platform-runtime
                  key: GUACAMOLE_POSTGRESQL_PORT
            - name: POSTGRESQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: platform-runtime
                  key: GUACAMOLE_POSTGRESQL_DATABASE
            - name: POSTGRESQL_AUTO_CREATE_ACCOUNTS
              value: "true"
            - name: JSON_ENABLED
              value: "true"
            - name: OPENID_ENABLED
              value: "false"
          envFrom:
            - secretRef:
                name: guacamole-runtime
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /guacamole/
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /guacamole/
              port: http
            initialDelaySeconds: 90
            periodSeconds: 30
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 60"]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: guac-home
          emptyDir: {}
