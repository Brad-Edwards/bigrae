apiVersion: apps/v1
kind: Deployment
metadata:
  name: guacd
  namespace: shifter-platform
  annotations:
    # CKV_K8S_43: the base manifest pins a placeholder image tag; every deploy
    # path rewrites it to the attested digest (ADR-037, _gcp-dev.yml).
    checkov.io/skip1: CKV_K8S_43=placeholder image is rewritten to an attested digest at deploy (ADR-037)
  labels:
    app.kubernetes.io/part-of: shifter
    app.kubernetes.io/component: guacd
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/part-of: shifter
      app.kubernetes.io/component: guacd
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: shifter
        app.kubernetes.io/component: guacd
    spec:
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: guacd
      automountServiceAccountToken: false
      # Exclusive access-pool placement (#1711 / ADR-039-R9): guacd is the
      # Guacamole SSH/RDP dialer into range guests, so its pod IP must come from
      # the dedicated access pod range that per-range participant ingress is
      # scoped to. The toleration is required because the access pool carries a
      # NoSchedule taint that keeps every other workload off it.
      nodeSelector:
        node-restriction.kubernetes.io/shifter-pool: access
      tolerations:
        - key: dedicated
          operator: Equal
          value: access
          effect: NoSchedule
      containers:
        - name: guacd
          image: us-docker.pkg.dev/placeholder-project/shifter/guacd:0.0.0
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          env:
            # UID 10001 has no passwd entry in the image, so HOME is "/" by
            # default. Set HOME so that FreeRDP uses its writable store.
            - name: HOME
              value: /home/guacd
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # FreeRDP persists its server certificate store here. Keep the
            # root filesystem read-only while making only that store writable.
            - name: freerdp-config
              mountPath: /home/guacd/.config/freerdp
          ports:
            - name: guacd
              containerPort: 4822
          readinessProbe:
            tcpSocket:
              port: guacd
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: guacd
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: freerdp-config
          emptyDir:
            sizeLimit: 16Mi
