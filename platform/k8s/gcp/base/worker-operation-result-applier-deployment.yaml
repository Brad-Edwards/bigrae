apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-operation-result-applier
  namespace: shifter-platform
  annotations:
    # CKV_K8S_43: the base manifest pins a placeholder image tag; every deploy
    # path rewrites it to the attested digest (ADR-037, _gcp-dev.yml).
    checkov.io/skip1: CKV_K8S_43=placeholder image is rewritten to an attested digest at deploy (ADR-037)
  labels:
    app.kubernetes.io/part-of: shifter
    app.kubernetes.io/component: worker-operation-result-applier
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/part-of: shifter
      app.kubernetes.io/component: worker-operation-result-applier
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: shifter
        app.kubernetes.io/component: worker-operation-result-applier
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: workers
      automountServiceAccountToken: false
      containers:
        - name: worker-operation-result-applier
          image: us-docker.pkg.dev/placeholder-project/shifter/portal:0.0.0
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          args: ["python", "manage.py", "apply_operation_results", "--loop", "--interval", "10"]
          envFrom:
            - configMapRef:
                name: platform-runtime
          # The pod is ready after the first loop pass writes the heartbeat.
          readinessProbe:
            exec:
              command: ["sh", "-c", "find /tmp/worker-operation-result-applier-heartbeat -mmin -2 | grep -q ."]
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            exec:
              command: ["sh", "-c", "find /tmp/worker-operation-result-applier-heartbeat -mmin -2 | grep -q ."]
            initialDelaySeconds: 90
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir: {}
