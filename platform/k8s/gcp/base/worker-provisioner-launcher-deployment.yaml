apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-provisioner-launcher
  namespace: shifter-platform
  annotations:
    # CKV_K8S_43: the base manifest pins a placeholder image tag; every deploy
    # path rewrites it to the attested digest (ADR-037, _gcp-dev.yml).
    checkov.io/skip1: CKV_K8S_43=placeholder image is rewritten to an attested digest at deploy (ADR-037)
    # CKV_K8S_38: the dedicated provisioner launcher needs the Kubernetes API to
    # create and manage provisioner Jobs (ADR-006-R4); automount stays enabled
    # for this controller only. Ordinary workers keep automount disabled.
    checkov.io/skip2: CKV_K8S_38=dedicated provisioner launcher requires Kubernetes API access (ADR-006-R4)
  labels:
    app.kubernetes.io/part-of: shifter
    app.kubernetes.io/component: worker-provisioner-launcher
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/part-of: shifter
      app.kubernetes.io/component: worker-provisioner-launcher
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: shifter
        app.kubernetes.io/component: worker-provisioner-launcher
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: provisioner-launcher
      automountServiceAccountToken: true
      containers:
        - name: worker-provisioner-launcher
          image: us-docker.pkg.dev/placeholder-project/shifter/portal:0.0.0
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          args: ["python", "manage.py", "drain_provisioner_launch_outbox", "--loop", "--interval", "10"]
          env:
            - name: SHIFTER_PROVISIONER_LAUNCHER
              value: "true"
          envFrom:
            - configMapRef:
                name: platform-runtime
          # The pod is ready after the first loop pass writes the heartbeat.
          readinessProbe:
            exec:
              command: ["sh", "-c", "find /tmp/worker-provisioner-launcher-heartbeat -mmin -2 | grep -q ."]
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            exec:
              command: ["sh", "-c", "find /tmp/worker-provisioner-launcher-heartbeat -mmin -2 | grep -q ."]
            initialDelaySeconds: 90
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 2Gi
      volumes:
        - name: tmp
          emptyDir: {}
