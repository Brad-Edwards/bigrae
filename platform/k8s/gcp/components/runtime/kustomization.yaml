apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - path: patch-runtime-secretref.patch
  - target:
      kind: ConfigMap
      name: platform-runtime
    patch: |-
      - op: add
        path: /metadata/namespace
        value: shifter-platform
  - target:
      kind: Secret
      name: platform-runtime-secrets
    patch: |-
      - op: add
        path: /metadata/namespace
        value: shifter-platform
