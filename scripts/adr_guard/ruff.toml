# Ruff policy for the ADR guard and the quality-ownership tooling (#1698).
# The adr-guard-lint CI job runs this config. The S rules are the security
# (bandit) checks for this tooling.
target-version = "py311"
line-length = 120

[lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "S", "T20", "SIM", "RUF", "C901"]
# S101: assert is the normal unittest and pytest idiom.
# T201: print is the CLI output channel of these tools.
# S603/S607: the tools run git with a fixed argv list and no shell. CI runs
#   them on a hosted runner where git comes from the runner image.
ignore = ["S101", "T201", "S603", "S607"]
