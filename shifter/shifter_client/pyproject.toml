[build-system]
requires = ["setuptools==84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bigrae-client"
version = "0.1.0"
description = "Renewable native service transport for BigRAE"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["google-auth[requests]>=2.40,<3"]

[project.optional-dependencies]
aws = ["boto3>=1.43,<2"]

[tool.setuptools]
packages = ["shifter_client", "bigrae_client"]
package-dir = {"shifter_client" = ".", "bigrae_client" = "bigrae_client"}
